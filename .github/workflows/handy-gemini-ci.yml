name: "Handy Gemini CI"

on:
  workflow_call:
    inputs:
      ref:
        description: "Exact commit to test"
        required: false
        type: string
        default: ""
  workflow_dispatch:
  push:
    branches:
      - main
      - "automation/upstream-*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: handy-gemini-ci-${{ inputs.ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-and-contracts:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.23

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check fork identity and updater isolation
        run: bun scripts/check-handy-gemini-release.ts

      - name: Test portable updater resolution
        run: bun src/components/update-checker/portableInstaller.test.ts

      - name: Check translations
        run: bun run check:translations

      - name: Lint frontend
        run: bun run lint

      - name: Check frontend formatting
        run: bunx prettier --check .

      - name: Build frontend
        run: bun run build

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        run: bun run test:playwright

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: handy-gemini-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  rust-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            glslc \
            libappindicator3-dev \
            libasound2-dev \
            libgtk-layer-shell-dev \
            librsvg2-dev \
            libssl-dev \
            libvulkan-dev \
            libwebkit2gtk-4.1-dev \
            spirv-headers

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Run Clippy
        working-directory: src-tauri
        # Stable upstream v0.9.6 has hundreds of pre-existing style/complexity
        # lints. Keep those out of the fork delta while failing release builds
        # on Clippy's defect-bearing groups.
        run: >-
          cargo clippy --all-targets --locked --
          -A clippy::all
          -D clippy::correctness
          -D clippy::suspicious
          -D clippy::perf

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked
