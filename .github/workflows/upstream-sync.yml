name: "Handy API Upstream Sync"

on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: handy-api-upstream-sync
  cancel-in-progress: false

jobs:
  prepare-candidate:
    if: github.repository == 'MakinaX/Handy-Api'
    runs-on: ubuntu-24.04
    outputs:
      update-required: ${{ steps.detect.outputs.update-required }}
      candidate-branch: ${{ steps.candidate.outputs.candidate-branch }}
      candidate-sha: ${{ steps.candidate.outputs.candidate-sha }}
      fork-version: ${{ steps.detect.outputs.fork-version }}
      release-tag: ${{ steps.detect.outputs.release-tag }}
      upstream-tag: ${{ steps.detect.outputs.upstream-tag }}
    steps:
      - name: Require main-owned workflow source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Upstream sync must be dispatched from the fork main branch" >&2
            exit 1
          fi

      - name: Checkout fork main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.23

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0

      - name: Detect latest upstream stable
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          fork_repo_json="$(gh api "repos/${GITHUB_REPOSITORY}")"
          if [[ "$(jq -r '.private' <<<"$fork_repo_json")" != "false" || \
                "$(jq -r '.visibility' <<<"$fork_repo_json")" != "public" ]]; then
            echo "Handy API releases require a public GitHub repository" >&2
            exit 1
          fi
          if [[ "$(jq -r '.default_branch' <<<"$fork_repo_json")" != "main" ]]; then
            echo "Handy API requires main as the default branch" >&2
            exit 1
          fi
          if [[ "$GITHUB_REPOSITORY" != "MakinaX/Handy-Api" ]]; then
            echo "Repository must be MakinaX/Handy-Api, got $GITHUB_REPOSITORY" >&2
            exit 1
          fi

          release_json="$(gh api repos/cjpais/Handy/releases/latest)"
          upstream_tag="$(jq -r '.tag_name' <<<"$release_json")"
          draft="$(jq -r '.draft' <<<"$release_json")"
          prerelease="$(jq -r '.prerelease' <<<"$release_json")"

          if [[ "$draft" != "false" || "$prerelease" != "false" ]]; then
            echo "Latest upstream release is not stable; refusing to continue" >&2
            exit 1
          fi
          if [[ ! "$upstream_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected upstream stable tag: $upstream_tag" >&2
            exit 1
          fi

          upstream_version="${upstream_tag#v}"
          fork_version="${upstream_version}-api.1"
          release_tag="v${fork_version}"
          expected_installer="Handy.API_${fork_version}_x64-setup.exe"

          git remote add upstream https://github.com/cjpais/Handy.git 2>/dev/null || \
            git remote set-url upstream https://github.com/cjpais/Handy.git
          git fetch --force upstream "refs/tags/${upstream_tag}:refs/tags/${upstream_tag}"

          integrated=false
          if git merge-base --is-ancestor "$upstream_tag" HEAD; then
            integrated=true
          fi

          published=false
          existing=false
          if fork_release_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" 2>/dev/null
          )"; then
            existing=true
            if jq -e \
              --arg tag "$release_tag" \
              --arg installer "$expected_installer" '
              ([.assets[].name]) as $assets |
              .tag_name == $tag and
              .draft == false and
              .prerelease == false and
              ($assets | sort) ==
                ([$installer, ($installer + ".sig"), "latest.json"] | sort)
            ' <<<"$fork_release_json" >/dev/null; then
              published=true
            else
              echo "Release $release_tag exists but is draft or has an incomplete/non-exact asset inventory" >&2
              echo "Resolve or delete that non-public release before retrying; it will never be overwritten" >&2
              exit 1
            fi
          fi

          fork_tag_sha="$(
            git ls-remote --tags origin "refs/tags/${release_tag}" |
              awk 'NR == 1 { print $1 }'
          )"
          if [[ "$existing" == "true" && -z "$fork_tag_sha" ]]; then
            echo "Release $release_tag exists without its exact Git tag" >&2
            exit 1
          fi
          if [[ "$existing" != "true" && -n "$fork_tag_sha" ]]; then
            echo "Git tag $release_tag exists without a release; refusing to retarget it" >&2
            exit 1
          fi
          if [[ "$published" == "true" ]]; then
            git fetch --force origin "refs/tags/${release_tag}:refs/tags/${release_tag}"
            if ! git merge-base --is-ancestor "$release_tag" HEAD; then
              echo "Published release tag $release_tag is not contained in fork main" >&2
              exit 1
            fi
          fi

          if [[ "$published" == "true" && "$integrated" != "true" ]]; then
            echo "Complete release $release_tag exists but fork main does not contain $upstream_tag" >&2
            exit 1
          fi

          update_required=true
          if [[ "$integrated" == "true" && "$published" == "true" ]]; then
            update_required=false
          fi

          echo "upstream-tag=$upstream_tag" >> "$GITHUB_OUTPUT"
          echo "fork-version=$fork_version" >> "$GITHUB_OUTPUT"
          echo "release-tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "update-required=$update_required" >> "$GITHUB_OUTPUT"
          echo "Latest upstream stable: $upstream_tag; integrated=$integrated; existing=$existing; published=$published"

      - name: Merge stable and reapply fork identity
        id: candidate
        if: steps.detect.outputs.update-required == 'true'
        env:
          FORK_VERSION: ${{ steps.detect.outputs.fork-version }}
          UPSTREAM_TAG: ${{ steps.detect.outputs.upstream-tag }}
        shell: bash
        run: |
          set -euo pipefail

          candidate_branch="automation/upstream-${UPSTREAM_TAG#v}"
          prior_candidate_sha="$(
            git ls-remote --heads origin "refs/heads/${candidate_branch}" |
              awk 'NR == 1 { print $1 }'
          )"
          preserved_updater="$RUNNER_TEMP/handy-api-tauri-before-merge.json"
          cp src-tauri/tauri.conf.json "$preserved_updater"

          git config user.name "handy-api-updater[bot]"
          git config user.email "handy-api-updater[bot]@users.noreply.github.com"
          git checkout -B "$candidate_branch"

          if ! git merge-base --is-ancestor "$UPSTREAM_TAG" HEAD; then
            set +e
            git merge --no-ff --no-commit "$UPSTREAM_TAG"
            merge_status=$?
            set -e

            if [[ $merge_status -ne 0 ]]; then
              unresolved="$(git diff --name-only --diff-filter=U)"
              if [[ -z "$unresolved" ]]; then
                echo "Upstream merge failed without resolvable file conflicts" >&2
                exit 1
              fi

              unexpected=""
              while IFS= read -r conflicted; do
                case "$conflicted" in
                  package.json|bun.lock|src-tauri/Cargo.toml|src-tauri/Cargo.lock|src-tauri/tauri.conf.json) ;;
                  *) unexpected+="$conflicted"$'\n' ;;
                esac
              done <<<"$unresolved"

              if [[ -n "$unexpected" ]]; then
                echo "Unexpected upstream conflicts; refusing automatic resolution:" >&2
                printf '%s' "$unexpected" >&2
                exit 1
              fi

              bun scripts/check-handy-api-release.ts --resolve-upstream-conflicts
              git add package.json bun.lock src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
              if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
                echo "Known release-metadata conflicts remain unresolved" >&2
                exit 1
              fi
            fi
          fi

          bun scripts/check-handy-api-release.ts \
            --set-version "$FORK_VERSION" \
            --preserve-updater-from "$preserved_updater"

          # Refresh generated root-workspace metadata after the upstream merge.
          # Dependency selection remains constrained by the merged lockfiles.
          bun install --lockfile-only --ignore-scripts
          cargo metadata \
            --manifest-path src-tauri/Cargo.toml \
            --format-version 1 \
            --no-deps >/dev/null

          bun scripts/check-handy-api-release.ts
          git add -A
          git diff --cached --check

          if ! git diff --cached --quiet || git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "chore: integrate Handy ${UPSTREAM_TAG} into Handy API"
          fi

          candidate_sha="$(git rev-parse HEAD)"
          if [[ -n "$prior_candidate_sha" ]]; then
            git push \
              --force-with-lease="refs/heads/${candidate_branch}:${prior_candidate_sha}" \
              origin "HEAD:refs/heads/${candidate_branch}"
          else
            git push origin "HEAD:refs/heads/${candidate_branch}"
          fi
          echo "candidate-branch=$candidate_branch" >> "$GITHUB_OUTPUT"
          echo "candidate-sha=$candidate_sha" >> "$GITHUB_OUTPUT"

  # This is a direct reusable-workflow call, not a workflow triggered by the
  # candidate-branch push. GitHub deliberately does not trigger new workflow
  # runs for pushes made with GITHUB_TOKEN, so all release gates stay in this run.
  candidate-gates:
    needs: prepare-candidate
    if: needs.prepare-candidate.outputs.update-required == 'true'
    uses: ./.github/workflows/handy-api-ci.yml
    with:
      ref: ${{ needs.prepare-candidate.outputs.candidate-sha }}

  release-contract:
    needs:
      - prepare-candidate
      - candidate-gates
    if: needs.prepare-candidate.outputs.update-required == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tested candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare-candidate.outputs.candidate-sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.23

      - name: Reject setup placeholders before release
        run: >-
          bun scripts/check-handy-api-release.ts
          --release
          --repository "$GITHUB_REPOSITORY"

  build-unsigned-windows-x64:
    needs:
      - prepare-candidate
      - candidate-gates
      - release-contract
    if: needs.prepare-candidate.outputs.update-required == 'true'
    runs-on: windows-latest
    outputs:
      unsigned-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
      unsigned-artifact-digest: ${{ steps.upload-unsigned.outputs.artifact-digest }}
      unsigned-receipt-artifact-id: ${{ steps.upload-unsigned-receipt.outputs.artifact-id }}
      unsigned-receipt-artifact-digest: ${{ steps.upload-unsigned-receipt.outputs.artifact-digest }}
    permissions:
      contents: read
    steps:
      - name: Checkout tested candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare-candidate.outputs.candidate-sha }}

      - name: Enable Windows long paths
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.23

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff # v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Locate VC++ runtime for app-local bundling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -property installationPath
          if (-not $vsRoot) { throw "vswhere found no Visual Studio installation" }
          $versionFile = Join-Path $vsRoot "VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt"
          $redistVersion = (Get-Content $versionFile).Trim()
          $archDir = Join-Path $vsRoot "VC\Redist\MSVC\$redistVersion\x64"
          $crt = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.CRT" |
            Sort-Object Name | Select-Object -Last 1
          $omp = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.OpenMP" |
            Sort-Object Name | Select-Object -Last 1
          if (-not $crt -or -not (Test-Path (Join-Path $crt.FullName "msvcp140.dll"))) {
            throw "VC++ CRT redistributable is unavailable"
          }
          if (-not $omp -or -not (Test-Path (Join-Path $omp.FullName "vcomp140.dll"))) {
            throw "VC++ OpenMP redistributable is unavailable"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "HANDY_VC_REDIST_DIRS=$($crt.FullName);$($omp.FullName)"

      - name: Install baseline ONNX Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ortVersion = "1.24.2"
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v$ortVersion/onnxruntime-win-x64-$ortVersion.zip"
          Invoke-WebRequest -Uri $url -OutFile ort.zip
          Expand-Archive -Path ort.zip -DestinationPath ort-dist -Force
          $ortLib = (Resolve-Path "ort-dist/onnxruntime-win-x64-$ortVersion/lib").Path
          Add-Content -Path $env:GITHUB_ENV -Value "ORT_LIB_LOCATION=$ortLib"
          Add-Content -Path $env:GITHUB_ENV -Value "ORT_PREFER_DYNAMIC_LINK=1"

      - name: Install SPIR-V headers
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_PREFIX_PATH=$prefix"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build unsigned NSIS updater artifact
        run: >-
          bun run tauri build
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
          --target x86_64-pc-windows-msvc
          --bundles nsis
          -- --locked

      - name: Verify exact unsigned updater output and runtime
        id: verify-unsigned
        env:
          CANDIDATE_SHA: ${{ needs.prepare-candidate.outputs.candidate-sha }}
          FORK_VERSION: ${{ needs.prepare-candidate.outputs.fork-version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          if (-not (Test-Path $bundle)) {
            throw "Target-specific NSIS bundle directory is missing: $bundle"
          }
          # Tauri names the raw NSIS file from productName and therefore keeps
          # the space in "Handy API". Require that exact single build output,
          # then canonicalize only its filename for the stable release URL.
          $generatedName = "Handy API_$($env:FORK_VERSION)_x64-setup.exe"
          $expectedName = "Handy.API_$($env:FORK_VERSION)_x64-setup.exe"
          $expectedPath = Join-Path $bundle $expectedName
          $generatedInstallers = @(Get-ChildItem $bundle -File -Filter "*-setup.exe")
          if ($generatedInstallers.Count -ne 1 -or
              $generatedInstallers[0].Name -cne $generatedName) {
            throw "Tauri must emit exactly one expected raw NSIS installer: $generatedName"
          }
          $generatedInstaller = $generatedInstallers[0]
          if (($generatedInstaller.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
            throw "Raw NSIS installer must not be a reparse point"
          }
          if (Get-ChildItem $bundle -File -Filter "*.sig") {
            throw "Unsigned build unexpectedly emitted an updater signature"
          }
          if (Test-Path $expectedPath) {
            throw "Canonical NSIS destination already exists: $expectedName"
          }
          $generatedHash = (Get-FileHash -LiteralPath $generatedInstaller.FullName `
            -Algorithm SHA256).Hash
          Move-Item -LiteralPath $generatedInstaller.FullName -Destination $expectedPath

          $canonicalInstallers = @(Get-ChildItem $bundle -File -Filter "*-setup.exe")
          if ($canonicalInstallers.Count -ne 1 -or
              $canonicalInstallers[0].Name -cne $expectedName -or
              -not (Test-Path $expectedPath -PathType Leaf)) {
            throw "Canonicalization must leave only the exact NSIS installer: $expectedName"
          }
          $installer = Get-Item -LiteralPath $expectedPath
          $canonicalHash = (Get-FileHash -LiteralPath $installer.FullName `
            -Algorithm SHA256).Hash
          if ($canonicalHash -cne $generatedHash) {
            throw "Canonical NSIS rename changed installer bytes"
          }

          # Exercise the shipped package, not the unbundled build output. This
          # is the x64 NSIS portable-mode smoke used by upstream, adjusted for
          # the fork's executable identity and target-specific output path.
          $stagedDlls = @(Get-ChildItem "src-tauri/transcribe-libs" -File -Filter "*.dll")
          if ($stagedDlls.Count -eq 0) {
            throw "src-tauri/transcribe-libs contains no staged runtime DLLs"
          }
          $installRoot = Join-Path $env:RUNNER_TEMP "handy-api-installed-$([Guid]::NewGuid())"
          New-Item -ItemType Directory -Path $installRoot | Out-Null
          try {
            $install = Start-Process -FilePath $installer.FullName `
              -ArgumentList @("/S", "/PORTABLE", "/D=$installRoot") `
              -Wait -PassThru
            if ($install.ExitCode -ne 0) {
              throw "Silent NSIS portable install failed with exit code $($install.ExitCode)"
            }

            $executables = @(Get-ChildItem $installRoot -Recurse -File -Filter "handy-api.exe")
            if ($executables.Count -ne 1) {
              throw "Installed package must contain exactly one handy-api.exe; found $($executables.Count)"
            }
            $appExe = $executables[0].FullName
            if (Get-ChildItem $installRoot -Recurse -File -Filter "handy.exe") {
              throw "Installed package still contains the official handy.exe identity"
            }
            $retiredGeminiExecutable = "handy-" + "gemini.exe"
            if (Get-ChildItem $installRoot -Recurse -File -Filter $retiredGeminiExecutable) {
              throw "Installed package still contains the retired Gemini-product executable identity"
            }
            foreach ($dll in $stagedDlls) {
              if (-not (Get-ChildItem $installRoot -Recurse -File -Filter $dll.Name)) {
                throw "Installed package is missing staged runtime DLL $($dll.Name)"
              }
            }

            $deviceOutput = (& $appExe --list-devices 2>&1 | Out-String)
            $deviceOutput | Write-Host
            if ($LASTEXITCODE -ne 0) {
              throw "Installed handy-api.exe --list-devices failed"
            }
          } finally {
            if (Test-Path $installRoot) {
              Remove-Item -Recurse -Force $installRoot
            }
          }

          $postSmokeHash = (Get-FileHash -LiteralPath $installer.FullName `
            -Algorithm SHA256).Hash
          if ($postSmokeHash -cne $generatedHash) {
            throw "Runtime smoke changed installer bytes"
          }
          New-Item -ItemType Directory -Path unsigned-assets -Force | Out-Null
          $stagedPath = Join-Path "unsigned-assets" $expectedName
          Copy-Item -LiteralPath $installer.FullName -Destination $stagedPath
          $stagedHash = (Get-FileHash -LiteralPath $stagedPath -Algorithm SHA256).Hash
          if ($stagedHash -cne $generatedHash) {
            throw "Staged unsigned installer bytes do not match the verified build"
          }
          $stagedInstaller = Get-Item -LiteralPath $stagedPath
          if ($env:GITHUB_REPOSITORY -cne "MakinaX/Handy-Api" -or
              $env:GITHUB_RUN_ID -notmatch '^[1-9][0-9]*$' -or
              $env:CANDIDATE_SHA -notmatch '^[0-9a-f]{40}$' -or
              $env:FORK_VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+-api\.[0-9]+$') {
            throw "Unsigned receipt identity inputs are invalid"
          }
          $stagedHash = $stagedHash.ToLowerInvariant()
          Add-Content -Path $env:GITHUB_OUTPUT -Value `
            "installer-filename=$expectedName"
          Add-Content -Path $env:GITHUB_OUTPUT -Value `
            "installer-size-bytes=$([int64]$stagedInstaller.Length)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value `
            "installer-sha256=$stagedHash"
          Get-FileHash -LiteralPath $stagedPath -Algorithm SHA256 | Format-List

      - name: Upload exact unsigned signing input
        id: upload-unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: handy-api-windows-x64-unsigned-${{ needs.prepare-candidate.outputs.fork-version }}
          path: unsigned-assets/Handy.API_${{ needs.prepare-candidate.outputs.fork-version }}_x64-setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Create durable unsigned receipt
        env:
          CANDIDATE_SHA: ${{ needs.prepare-candidate.outputs.candidate-sha }}
          FORK_VERSION: ${{ needs.prepare-candidate.outputs.fork-version }}
          INSTALLER_FILENAME: ${{ steps.verify-unsigned.outputs.installer-filename }}
          INSTALLER_SIZE_BYTES: ${{ steps.verify-unsigned.outputs.installer-size-bytes }}
          INSTALLER_SHA256: ${{ steps.verify-unsigned.outputs.installer-sha256 }}
          UNSIGNED_ARTIFACT_ID: ${{ steps.upload-unsigned.outputs.artifact-id }}
          UNSIGNED_ARTIFACT_ARCHIVE_SHA256: ${{ steps.upload-unsigned.outputs.artifact-digest }}
          UNSIGNED_ARTIFACT_NAME: handy-api-windows-x64-unsigned-${{ needs.prepare-candidate.outputs.fork-version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedName = "Handy.API_$($env:FORK_VERSION)_x64-setup.exe"
          if ($env:GITHUB_REPOSITORY -cne "MakinaX/Handy-Api" -or
              $env:GITHUB_RUN_ID -notmatch '^[1-9][0-9]*$' -or
              $env:CANDIDATE_SHA -notmatch '^[0-9a-f]{40}$' -or
              $env:FORK_VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+-api\.[0-9]+$' -or
              $env:INSTALLER_FILENAME -cne $expectedName -or
              $env:INSTALLER_SIZE_BYTES -notmatch '^[1-9][0-9]*$' -or
              $env:INSTALLER_SHA256 -notmatch '^[0-9a-f]{64}$' -or
              $env:UNSIGNED_ARTIFACT_ID -notmatch '^[1-9][0-9]*$' -or
              $env:UNSIGNED_ARTIFACT_ARCHIVE_SHA256 -notmatch '^[0-9a-f]{64}$') {
            throw "Unsigned receipt inputs are invalid"
          }
          $stagedPath = Join-Path "unsigned-assets" $expectedName
          $stagedInstaller = Get-Item -LiteralPath $stagedPath
          $stagedHash = (Get-FileHash -LiteralPath $stagedPath `
            -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($stagedInstaller.Length -ne [int64]$env:INSTALLER_SIZE_BYTES -or
              $stagedHash -cne $env:INSTALLER_SHA256) {
            throw "Uploaded installer source no longer matches verified build outputs"
          }

          $receiptDirectory = "unsigned-receipt"
          $receiptFilename = "handy-api-windows-x64-unsigned-receipt.json"
          New-Item -ItemType Directory -Path $receiptDirectory -Force | Out-Null
          $receiptPath = Join-Path $receiptDirectory $receiptFilename
          $receipt = [ordered]@{
            schema_version = 1
            repository = $env:GITHUB_REPOSITORY
            github_run_id = [string]$env:GITHUB_RUN_ID
            candidate_sha = $env:CANDIDATE_SHA
            fork_version = $env:FORK_VERSION
            unsigned_artifact_name = $env:UNSIGNED_ARTIFACT_NAME
            unsigned_artifact_id = $env:UNSIGNED_ARTIFACT_ID
            unsigned_artifact_archive_sha256 = $env:UNSIGNED_ARTIFACT_ARCHIVE_SHA256
            installer_filename = $expectedName
            installer_size_bytes = [int64]$stagedInstaller.Length
            installer_sha256 = $stagedHash
          }
          $receipt | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath $receiptPath `
            -Encoding utf8NoBOM

          $receiptFiles = @(Get-ChildItem $receiptDirectory -Recurse -File)
          if ($receiptFiles.Count -ne 1 -or
              $receiptFiles[0].Name -cne $receiptFilename) {
            throw "Unsigned receipt artifact must contain only $receiptFilename"
          }
          $receiptReadback = Get-Content -LiteralPath $receiptPath -Raw |
            ConvertFrom-Json
          $expectedReceiptFields = @(
            "schema_version",
            "repository",
            "github_run_id",
            "candidate_sha",
            "fork_version",
            "unsigned_artifact_name",
            "unsigned_artifact_id",
            "unsigned_artifact_archive_sha256",
            "installer_filename",
            "installer_size_bytes",
            "installer_sha256"
          ) | Sort-Object -CaseSensitive
          $actualReceiptFields = @($receiptReadback.PSObject.Properties.Name) |
            Sort-Object -CaseSensitive
          if ($actualReceiptFields.Count -ne $expectedReceiptFields.Count -or
              [string]::Join("`n", $actualReceiptFields) -cne
                [string]::Join("`n", $expectedReceiptFields) -or
              $receiptReadback.schema_version.GetType().FullName -notin
                @("System.Int32", "System.Int64") -or
              [int64]$receiptReadback.schema_version -ne 1 -or
              $receiptReadback.repository -cne $env:GITHUB_REPOSITORY -or
              $receiptReadback.github_run_id -cne [string]$env:GITHUB_RUN_ID -or
              $receiptReadback.candidate_sha -cne $env:CANDIDATE_SHA -or
              $receiptReadback.fork_version -cne $env:FORK_VERSION -or
              $receiptReadback.unsigned_artifact_name -cne $env:UNSIGNED_ARTIFACT_NAME -or
              $receiptReadback.unsigned_artifact_id -cne $env:UNSIGNED_ARTIFACT_ID -or
              $receiptReadback.unsigned_artifact_archive_sha256 -cne
                $env:UNSIGNED_ARTIFACT_ARCHIVE_SHA256 -or
              $receiptReadback.installer_filename -cne $expectedName -or
              [int64]$receiptReadback.installer_size_bytes -ne
                $stagedInstaller.Length -or
              $receiptReadback.installer_sha256 -cne $stagedHash) {
            throw "Unsigned receipt read-back does not match immutable artifact inputs"
          }
          Get-FileHash -LiteralPath $stagedPath, $receiptPath -Algorithm SHA256 |
            Format-List

      - name: Upload durable unsigned receipt
        id: upload-unsigned-receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: handy-api-windows-x64-unsigned-receipt-${{ needs.prepare-candidate.outputs.fork-version }}
          path: unsigned-receipt/handy-api-windows-x64-unsigned-receipt.json
          if-no-files-found: error
          retention-days: 14

  sign-windows-updater:
    needs:
      - prepare-candidate
      - candidate-gates
      - release-contract
      - build-unsigned-windows-x64
    if: needs.prepare-candidate.outputs.update-required == 'true'
    runs-on: windows-latest
    outputs:
      signed-artifact-id: ${{ steps.upload-signed.outputs.artifact-id }}
      signed-artifact-digest: ${{ steps.upload-signed.outputs.artifact-digest }}
      signing-receipt-artifact-id: ${{ steps.upload-signing-receipt.outputs.artifact-id }}
      signing-receipt-artifact-digest: ${{ steps.upload-signing-receipt.outputs.artifact-digest }}
    # This is the first point at which updater signing secrets are available.
    # The required reviewer approves the tested unsigned candidate before this
    # job starts. This job never checks out or executes candidate source: it
    # signs only the exact installer artifact built by the preceding job.
    environment:
      name: handy-api-signing
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download exact unsigned signing input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build-unsigned-windows-x64.outputs.unsigned-artifact-id }}
          path: signing-input
          merge-multiple: true

      - name: Download durable unsigned receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build-unsigned-windows-x64.outputs.unsigned-receipt-artifact-id }}
          path: unsigned-receipt
          merge-multiple: true

      - name: Verify exact unsigned receipt and signing input
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ needs.prepare-candidate.outputs.candidate-sha }}
          FORK_VERSION: ${{ needs.prepare-candidate.outputs.fork-version }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SOURCE_SHA: ${{ github.sha }}
          UNSIGNED_ARTIFACT_ID: ${{ needs.build-unsigned-windows-x64.outputs.unsigned-artifact-id }}
          UNSIGNED_ARTIFACT_ARCHIVE_SHA256: ${{ needs.build-unsigned-windows-x64.outputs.unsigned-artifact-digest }}
          UNSIGNED_RECEIPT_ARTIFACT_ID: ${{ needs.build-unsigned-windows-x64.outputs.unsigned-receipt-artifact-id }}
          UNSIGNED_RECEIPT_ARTIFACT_ARCHIVE_SHA256: ${{ needs.build-unsigned-windows-x64.outputs.unsigned-receipt-artifact-digest }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -cne "MakinaX/Handy-Api") {
            throw "Signing is restricted to MakinaX/Handy-Api"
          }
          if ($env:CANDIDATE_SHA -notmatch '^[0-9a-f]{40}$') {
            throw "Candidate SHA is not an exact commit ID"
          }

          $expectedName = "Handy.API_$($env:FORK_VERSION)_x64-setup.exe"
          $expectedArtifactName = "handy-api-windows-x64-unsigned-$($env:FORK_VERSION)"
          $expectedReceiptFilename = "handy-api-windows-x64-unsigned-receipt.json"
          $inputFiles = @(Get-ChildItem signing-input -Recurse -File)
          if ($inputFiles.Count -ne 1 -or $inputFiles[0].Name -cne $expectedName) {
            throw "Signing input must contain only $expectedName"
          }
          $installer = $inputFiles[0]
          if (($installer.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
            throw "Signing input installer must not be a reparse point"
          }

          $receiptFiles = @(Get-ChildItem unsigned-receipt -Recurse -File)
          if ($receiptFiles.Count -ne 1 -or
              $receiptFiles[0].Name -cne $expectedReceiptFilename) {
            throw "Unsigned receipt artifact must contain only $expectedReceiptFilename"
          }
          $receiptFile = $receiptFiles[0]
          if (($receiptFile.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
            throw "Unsigned receipt must not be a reparse point"
          }
          if ($receiptFile.Length -le 0 -or $receiptFile.Length -gt 16384) {
            throw "Unsigned receipt size is outside the strict evidence bound"
          }
          try {
            $receiptBytes = [IO.File]::ReadAllBytes($receiptFile.FullName)
            $strictUtf8 = [Text.UTF8Encoding]::new($false, $true)
            $receiptText = $strictUtf8.GetString($receiptBytes)
            $receiptDocument = [Text.Json.JsonDocument]::Parse($receiptText)
            if ($receiptDocument.RootElement.ValueKind -cne
                [Text.Json.JsonValueKind]::Object) {
              throw "Unsigned receipt root must be one JSON object"
            }
            $rawReceiptFields = @()
            $rawReceiptKinds = @{}
            foreach ($property in $receiptDocument.RootElement.EnumerateObject()) {
              $rawReceiptFields += $property.Name
              $rawReceiptKinds[$property.Name] = $property.Value.ValueKind
            }
            $receipt = $receiptText | ConvertFrom-Json
          } catch {
            throw "Unsigned receipt is not valid JSON"
          } finally {
            if ($null -ne $receiptDocument) {
              $receiptDocument.Dispose()
            }
          }
          $expectedReceiptFields = @(
            "schema_version",
            "repository",
            "github_run_id",
            "candidate_sha",
            "fork_version",
            "unsigned_artifact_name",
            "unsigned_artifact_id",
            "unsigned_artifact_archive_sha256",
            "installer_filename",
            "installer_size_bytes",
            "installer_sha256"
          ) | Sort-Object -CaseSensitive
          $actualReceiptFields = @($rawReceiptFields) | Sort-Object -CaseSensitive
          if ($actualReceiptFields.Count -ne $expectedReceiptFields.Count -or
              [string]::Join("`n", $actualReceiptFields) -cne
                [string]::Join("`n", $expectedReceiptFields)) {
            throw "Unsigned receipt schema has missing, extra, or mis-cased fields"
          }
          foreach ($stringField in @(
            "repository",
            "github_run_id",
            "candidate_sha",
            "fork_version",
            "unsigned_artifact_name",
            "unsigned_artifact_id",
            "unsigned_artifact_archive_sha256",
            "installer_filename",
            "installer_sha256"
          )) {
            if ($rawReceiptKinds[$stringField] -cne
                [Text.Json.JsonValueKind]::String) {
              throw "Unsigned receipt field $stringField must be a JSON string"
            }
          }
          if ($rawReceiptKinds["schema_version"] -cne
                [Text.Json.JsonValueKind]::Number -or
              $rawReceiptKinds["installer_size_bytes"] -cne
                [Text.Json.JsonValueKind]::Number) {
            throw "Unsigned receipt numeric fields must be JSON numbers"
          }
          if ($receipt.schema_version.GetType().FullName -notin
                @("System.Int32", "System.Int64") -or
              [int64]$receipt.schema_version -ne 1 -or
              $receipt.repository -cne "MakinaX/Handy-Api" -or
              $receipt.github_run_id -cne [string]$env:GITHUB_RUN_ID -or
              $receipt.candidate_sha -cne $env:CANDIDATE_SHA -or
              $receipt.candidate_sha -notmatch '^[0-9a-f]{40}$' -or
              $receipt.fork_version -cne $env:FORK_VERSION -or
              $receipt.unsigned_artifact_name -cne $expectedArtifactName -or
              $receipt.unsigned_artifact_id -cne $env:UNSIGNED_ARTIFACT_ID -or
              $receipt.unsigned_artifact_id -notmatch '^[1-9][0-9]*$' -or
              $receipt.unsigned_artifact_archive_sha256 -cne
                $env:UNSIGNED_ARTIFACT_ARCHIVE_SHA256 -or
              $receipt.unsigned_artifact_archive_sha256 -notmatch
                '^[0-9a-f]{64}$' -or
              $receipt.installer_filename -cne $expectedName -or
              $receipt.installer_sha256 -notmatch '^[0-9a-f]{64}$' -or
              $receipt.installer_size_bytes.GetType().FullName -notin
                @("System.Int32", "System.Int64") -or
              [int64]$receipt.installer_size_bytes -le 0) {
            throw "Unsigned receipt identity or value contract is invalid"
          }
          $actualInstallerHash = (Get-FileHash -LiteralPath $installer.FullName `
            -Algorithm SHA256).Hash.ToLowerInvariant()
          $actualInstallerSize = [int64]$installer.Length
          if ($actualInstallerHash -cne $receipt.installer_sha256 -or
              $actualInstallerSize -ne [int64]$receipt.installer_size_bytes) {
            throw "Signing input bytes do not match the durable unsigned receipt"
          }
          $unsignedReceiptHash = (Get-FileHash -LiteralPath $receiptFile.FullName `
            -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content -Path $env:GITHUB_ENV -Value `
            "HANDY_API_UNSIGNED_RECEIPT_SHA256=$unsignedReceiptHash"
          Add-Content -Path $env:GITHUB_ENV -Value `
            "HANDY_API_RECEIPT_INSTALLER_SHA256=$actualInstallerHash"
          Add-Content -Path $env:GITHUB_ENV -Value `
            "HANDY_API_RECEIPT_INSTALLER_SIZE=$actualInstallerSize"

          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $unsignedArtifactUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:UNSIGNED_ARTIFACT_ID"
          $unsignedArtifact = Invoke-RestMethod -Uri $unsignedArtifactUri `
            -Headers $headers
          $unsignedReceiptArtifactUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:UNSIGNED_RECEIPT_ARTIFACT_ID"
          $unsignedReceiptArtifact = Invoke-RestMethod `
            -Uri $unsignedReceiptArtifactUri -Headers $headers
          if ([string]$unsignedArtifact.id -cne $env:UNSIGNED_ARTIFACT_ID -or
              $unsignedArtifact.name -cne $expectedArtifactName -or
              $unsignedArtifact.expired -cne $false -or
              [string]$unsignedArtifact.workflow_run.id -cne
                [string]$env:GITHUB_RUN_ID -or
              $unsignedArtifact.workflow_run.head_sha -cne
                $env:WORKFLOW_SOURCE_SHA -or
              $unsignedArtifact.digest -cne
                "sha256:$($env:UNSIGNED_ARTIFACT_ARCHIVE_SHA256)" -or
              [int64]$unsignedArtifact.size_in_bytes -le 0) {
            throw "Unsigned artifact API metadata does not match its durable receipt"
          }
          $expectedReceiptArtifactName = `
            "handy-api-windows-x64-unsigned-receipt-$($env:FORK_VERSION)"
          if ([string]$unsignedReceiptArtifact.id -cne
                $env:UNSIGNED_RECEIPT_ARTIFACT_ID -or
              $unsignedReceiptArtifact.name -cne $expectedReceiptArtifactName -or
              $unsignedReceiptArtifact.expired -cne $false -or
              [string]$unsignedReceiptArtifact.workflow_run.id -cne
                [string]$env:GITHUB_RUN_ID -or
              $unsignedReceiptArtifact.workflow_run.head_sha -cne
                $env:WORKFLOW_SOURCE_SHA -or
              $unsignedReceiptArtifact.digest -cne
                "sha256:$($env:UNSIGNED_RECEIPT_ARTIFACT_ARCHIVE_SHA256)" -or
              [int64]$unsignedReceiptArtifact.size_in_bytes -le 0) {
            throw "Unsigned receipt artifact API metadata is not exact"
          }
          Add-Content -Path $env:GITHUB_ENV -Value `
            "HANDY_API_UNSIGNED_RECEIPT_ARTIFACT_ID=$($env:UNSIGNED_RECEIPT_ARTIFACT_ID)"
          Add-Content -Path $env:GITHUB_ENV -Value `
            "HANDY_API_UNSIGNED_RECEIPT_ARTIFACT_ARCHIVE_SHA256=$($env:UNSIGNED_RECEIPT_ARTIFACT_ARCHIVE_SHA256)"

          $configUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/src-tauri/tauri.conf.json?ref=$env:CANDIDATE_SHA"
          $response = Invoke-RestMethod -Uri $configUri -Headers $headers
          $configBytes = [Convert]::FromBase64String(($response.content -replace '\s', ''))
          $config = [Text.Encoding]::UTF8.GetString($configBytes) | ConvertFrom-Json
          $expectedEndpoint = "https://github.com/MakinaX/Handy-Api/releases/latest/download/latest.json"
          if ($config.productName -cne "Handy API" -or
              $config.mainBinaryName -cne "handy-api" -or
              $config.version -cne $env:FORK_VERSION -or
              $config.identifier -cne "computer.handy.api" -or
              $config.plugins.updater.endpoints.Count -ne 1 -or
              $config.plugins.updater.endpoints[0] -cne $expectedEndpoint) {
            throw "Candidate updater identity does not match the exact signing contract"
          }
          if ([string]::IsNullOrWhiteSpace($config.plugins.updater.pubkey) -or
              $config.plugins.updater.pubkey -ceq "REPLACE_WITH_TAURI_UPDATER_PUBLIC_KEY") {
            throw "Committed updater public key is missing or still a placeholder"
          }
          Set-Content -Path (Join-Path $env:RUNNER_TEMP "handy-api-updater-public-key.base64") `
            -Value $config.plugins.updater.pubkey -NoNewline

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0

      - name: Install trusted Tauri signer without secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signerRoot = Join-Path $env:RUNNER_TEMP "trusted-tauri-cli"
          cargo install tauri-cli --version 2.11.4 --locked --root $signerRoot
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned Tauri CLI installation failed"
          }
          $signerExe = Join-Path $signerRoot "bin/cargo-tauri.exe"
          if (-not (Test-Path $signerExe -PathType Leaf)) {
            throw "Pinned Tauri signer executable is missing"
          }
          $signerVersion = (& $signerExe --version | Out-String).Trim()
          if ($signerVersion -cne "tauri-cli 2.11.4") {
            throw "Unexpected Tauri signer version: $signerVersion"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNER_EXE=$signerExe"

      - name: Sign exact updater artifact
        shell: pwsh
        env:
          FORK_VERSION: ${{ needs.prepare-candidate.outputs.fork-version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is not configured in handy-api-signing"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not configured in handy-api-signing"
          }
          $installer = Join-Path signing-input "Handy.API_$($env:FORK_VERSION)_x64-setup.exe"
          $preSignFiles = @(Get-ChildItem signing-input -Recurse -File)
          if ($preSignFiles.Count -ne 1 -or
              $preSignFiles[0].Name -cne
                "Handy.API_$($env:FORK_VERSION)_x64-setup.exe") {
            throw "Pre-sign input must still contain only the exact installer"
          }
          $preSignHash = (Get-FileHash -LiteralPath $installer `
            -Algorithm SHA256).Hash.ToLowerInvariant()
          $preSignSize = [int64](Get-Item -LiteralPath $installer).Length
          if ($preSignHash -cne $env:HANDY_API_RECEIPT_INSTALLER_SHA256 -or
              $preSignSize -ne [int64]$env:HANDY_API_RECEIPT_INSTALLER_SIZE) {
            throw "Pre-sign installer bytes differ from the durable unsigned receipt"
          }
          & $env:TAURI_SIGNER_EXE signer sign $installer
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned Tauri updater signing failed"
          }
          $postSignHash = (Get-FileHash -LiteralPath $installer `
            -Algorithm SHA256).Hash.ToLowerInvariant()
          $postSignSize = [int64](Get-Item -LiteralPath $installer).Length
          if ($postSignHash -cne $preSignHash -or
              $postSignSize -ne $preSignSize) {
            throw "Tauri signer changed installer bytes"
          }
          $signaturePath = "${installer}.sig"
          $postSignFiles = @(Get-ChildItem signing-input -Recurse -File)
          if ($postSignFiles.Count -ne 2 -or
              -not (Test-Path $signaturePath -PathType Leaf) -or
              (Get-Item -LiteralPath $signaturePath).Length -le 0) {
            throw "Tauri signer must add only the exact non-empty .sig file"
          }
          $measurements = [ordered]@{
            pre_sign_installer_sha256 = $preSignHash
            post_sign_installer_sha256 = $postSignHash
            pre_sign_installer_size_bytes = $preSignSize
            post_sign_installer_size_bytes = $postSignSize
          }
          $measurementsPath = Join-Path $env:RUNNER_TEMP `
            "handy-api-signing-measurements.json"
          $measurements | ConvertTo-Json -Depth 3 | Set-Content `
            -LiteralPath $measurementsPath -Encoding utf8NoBOM

      - name: Verify byte invariance and exact signature with committed public key
        id: verify-signed
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ needs.prepare-candidate.outputs.candidate-sha }}
          FORK_VERSION: ${{ needs.prepare-candidate.outputs.fork-version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedName = "Handy.API_$($env:FORK_VERSION)_x64-setup.exe"
          $installer = Join-Path signing-input $expectedName
          $signaturePath = "${installer}.sig"
          $signedFiles = @(Get-ChildItem signing-input -Recurse -File)
          if ($signedFiles.Count -ne 2 -or
              -not (Test-Path $installer -PathType Leaf) -or
              -not (Test-Path $signaturePath -PathType Leaf) -or
              (Get-Item $signaturePath).Length -eq 0) {
            throw "Signed artifact must contain only the exact installer and its non-empty .sig"
          }
          $foreignInstallers = @(
            Get-ChildItem signing-input -Recurse -File -Filter "*-setup.exe" |
              Where-Object Name -CNE $expectedName
          )
          if ($foreignInstallers.Count -ne 0) {
            throw "Foreign signed installer found: $($foreignInstallers.Name -join ', ')"
          }
          $measurementsPath = Join-Path $env:RUNNER_TEMP `
            "handy-api-signing-measurements.json"
          if (-not (Test-Path $measurementsPath -PathType Leaf)) {
            throw "Signing byte measurements are missing"
          }
          $measurements = Get-Content -LiteralPath $measurementsPath -Raw |
            ConvertFrom-Json
          $currentInstallerHash = (Get-FileHash -LiteralPath $installer `
            -Algorithm SHA256).Hash.ToLowerInvariant()
          $currentInstallerSize = [int64](Get-Item -LiteralPath $installer).Length
          if ($measurements.pre_sign_installer_sha256 -cne
                $env:HANDY_API_RECEIPT_INSTALLER_SHA256 -or
              $measurements.post_sign_installer_sha256 -cne
                $measurements.pre_sign_installer_sha256 -or
              $currentInstallerHash -cne $measurements.post_sign_installer_sha256 -or
              [int64]$measurements.pre_sign_installer_size_bytes -ne
                [int64]$env:HANDY_API_RECEIPT_INSTALLER_SIZE -or
              [int64]$measurements.post_sign_installer_size_bytes -ne
                [int64]$measurements.pre_sign_installer_size_bytes -or
              $currentInstallerSize -ne
                [int64]$measurements.post_sign_installer_size_bytes) {
            throw "Installer byte invariance evidence does not match the unsigned receipt"
          }

          $verifierUrl = "https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip"
          $verifierArchive = Join-Path $env:RUNNER_TEMP "minisign-0.12-win64.zip"
          $verifierRoot = Join-Path $env:RUNNER_TEMP "minisign-0.12-win64"
          Invoke-WebRequest -Uri $verifierUrl -OutFile $verifierArchive
          $verifierHash = (Get-FileHash $verifierArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($verifierHash -ne "37b600344e20c19314b2e82813db2bfdcc408b77b876f7727889dbd46d539479") {
            throw "Pinned Minisign verifier archive digest mismatch"
          }
          Expand-Archive -Path $verifierArchive -DestinationPath $verifierRoot -Force
          $verifiers = @(Get-ChildItem $verifierRoot -Recurse -File -Filter "minisign.exe")
          if ($verifiers.Count -ne 1) {
            throw "Expected exactly one minisign.exe, found $($verifiers.Count)"
          }

          $publicKeyBase64 = Get-Content `
            (Join-Path $env:RUNNER_TEMP "handy-api-updater-public-key.base64") -Raw
          $publicKeyPath = Join-Path $env:RUNNER_TEMP "handy-api-updater.pub"
          $decodedSignaturePath = Join-Path $env:RUNNER_TEMP "handy-api-installer.minisig"
          try {
            [IO.File]::WriteAllBytes(
              $publicKeyPath,
              [Convert]::FromBase64String($publicKeyBase64.Trim())
            )
            [IO.File]::WriteAllBytes(
              $decodedSignaturePath,
              [Convert]::FromBase64String((Get-Content $signaturePath -Raw).Trim())
            )
          } catch {
            throw "Updater public key or signature is not valid base64"
          }

          $verifierExe = $verifiers[0].FullName
          & $verifierExe -Vm $installer -p $publicKeyPath -x $decodedSignaturePath
          if ($LASTEXITCODE -ne 0) {
            throw "Cryptographic updater signature verification failed"
          }

          New-Item -ItemType Directory -Path signed-assets -Force | Out-Null
          Copy-Item -LiteralPath $installer -Destination signed-assets/
          Copy-Item -LiteralPath $signaturePath -Destination signed-assets/
          $signatureHash = (Get-FileHash -LiteralPath $signaturePath `
            -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content -Path $env:GITHUB_OUTPUT -Value `
            "installer-filename=$expectedName"
          Add-Content -Path $env:GITHUB_OUTPUT -Value `
            "installer-size-bytes=$currentInstallerSize"
          Add-Content -Path $env:GITHUB_OUTPUT -Value `
            "pre-sign-installer-sha256=$($measurements.pre_sign_installer_sha256)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value `
            "post-sign-installer-sha256=$($measurements.post_sign_installer_sha256)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value `
            "signature-filename=$expectedName.sig"
          Add-Content -Path $env:GITHUB_OUTPUT -Value `
            "signature-sha256=$signatureHash"
          Get-FileHash -LiteralPath $installer, $signaturePath -Algorithm SHA256 |
            Format-List

      - name: Upload exact signed acceptance artifact
        id: upload-signed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: handy-api-windows-x64-signed-${{ needs.prepare-candidate.outputs.fork-version }}
          path: |
            signed-assets/Handy.API_${{ needs.prepare-candidate.outputs.fork-version }}_x64-setup.exe
            signed-assets/Handy.API_${{ needs.prepare-candidate.outputs.fork-version }}_x64-setup.exe.sig
          if-no-files-found: error
          retention-days: 14

      - name: Create durable signing receipt
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ needs.prepare-candidate.outputs.candidate-sha }}
          FORK_VERSION: ${{ needs.prepare-candidate.outputs.fork-version }}
          INSTALLER_FILENAME: ${{ steps.verify-signed.outputs.installer-filename }}
          INSTALLER_SIZE_BYTES: ${{ steps.verify-signed.outputs.installer-size-bytes }}
          PRE_SIGN_INSTALLER_SHA256: ${{ steps.verify-signed.outputs.pre-sign-installer-sha256 }}
          POST_SIGN_INSTALLER_SHA256: ${{ steps.verify-signed.outputs.post-sign-installer-sha256 }}
          SIGNATURE_FILENAME: ${{ steps.verify-signed.outputs.signature-filename }}
          SIGNATURE_SHA256: ${{ steps.verify-signed.outputs.signature-sha256 }}
          SIGNED_ARTIFACT_NAME: handy-api-windows-x64-signed-${{ needs.prepare-candidate.outputs.fork-version }}
          SIGNED_ARTIFACT_ID: ${{ steps.upload-signed.outputs.artifact-id }}
          SIGNED_ARTIFACT_ARCHIVE_SHA256: ${{ steps.upload-signed.outputs.artifact-digest }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedName = "Handy.API_$($env:FORK_VERSION)_x64-setup.exe"
          $expectedSignatureName = "$expectedName.sig"
          $expectedSignedArtifactName = `
            "handy-api-windows-x64-signed-$($env:FORK_VERSION)"
          if ($env:GITHUB_REPOSITORY -cne "MakinaX/Handy-Api" -or
              $env:GITHUB_RUN_ID -notmatch '^[1-9][0-9]*$' -or
              $env:CANDIDATE_SHA -notmatch '^[0-9a-f]{40}$' -or
              $env:FORK_VERSION -notmatch
                '^[0-9]+\.[0-9]+\.[0-9]+-api\.[0-9]+$' -or
              $env:INSTALLER_FILENAME -cne $expectedName -or
              $env:INSTALLER_SIZE_BYTES -notmatch '^[1-9][0-9]*$' -or
              $env:PRE_SIGN_INSTALLER_SHA256 -notmatch '^[0-9a-f]{64}$' -or
              $env:POST_SIGN_INSTALLER_SHA256 -cne
                $env:PRE_SIGN_INSTALLER_SHA256 -or
              $env:SIGNATURE_FILENAME -cne $expectedSignatureName -or
              $env:SIGNATURE_SHA256 -notmatch '^[0-9a-f]{64}$' -or
              $env:SIGNED_ARTIFACT_NAME -cne $expectedSignedArtifactName -or
              $env:SIGNED_ARTIFACT_ID -notmatch '^[1-9][0-9]*$' -or
              $env:SIGNED_ARTIFACT_ARCHIVE_SHA256 -notmatch
                '^[0-9a-f]{64}$' -or
              $env:HANDY_API_UNSIGNED_RECEIPT_ARTIFACT_ID -notmatch
                '^[1-9][0-9]*$' -or
              $env:HANDY_API_UNSIGNED_RECEIPT_ARTIFACT_ARCHIVE_SHA256 -notmatch
                '^[0-9a-f]{64}$' -or
              $env:HANDY_API_UNSIGNED_RECEIPT_SHA256 -notmatch
                '^[0-9a-f]{64}$') {
            throw "Signing receipt inputs are invalid"
          }

          $signedFiles = @(Get-ChildItem signed-assets -Recurse -File)
          if ($signedFiles.Count -ne 2) {
            throw "Signed acceptance artifact must contain exactly two files"
          }
          $installer = Join-Path signed-assets $expectedName
          $signaturePath = Join-Path signed-assets $expectedSignatureName
          if (-not (Test-Path $installer -PathType Leaf) -or
              -not (Test-Path $signaturePath -PathType Leaf) -or
              (Get-Item -LiteralPath $signaturePath).Length -le 0) {
            throw "Signed acceptance files are incomplete"
          }
          foreach ($signedFile in $signedFiles) {
            if (($signedFile.Attributes -band
                [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw "Signed acceptance files must not be reparse points"
            }
          }
          $installerHash = (Get-FileHash -LiteralPath $installer `
            -Algorithm SHA256).Hash.ToLowerInvariant()
          $installerSize = [int64](Get-Item -LiteralPath $installer).Length
          $signatureHash = (Get-FileHash -LiteralPath $signaturePath `
            -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($installerHash -cne $env:PRE_SIGN_INSTALLER_SHA256 -or
              $installerHash -cne $env:POST_SIGN_INSTALLER_SHA256 -or
              $installerSize -ne [int64]$env:INSTALLER_SIZE_BYTES -or
              $signatureHash -cne $env:SIGNATURE_SHA256) {
            throw "Uploaded signed artifact source differs from verified evidence"
          }

          $unsignedReceiptPath = Join-Path unsigned-receipt `
            "handy-api-windows-x64-unsigned-receipt.json"
          if (-not (Test-Path $unsignedReceiptPath -PathType Leaf)) {
            throw "Verified unsigned receipt is missing"
          }
          $unsignedReceiptHash = (Get-FileHash `
            -LiteralPath $unsignedReceiptPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($unsignedReceiptHash -cne $env:HANDY_API_UNSIGNED_RECEIPT_SHA256) {
            throw "Unsigned receipt changed after pre-sign verification"
          }

          $signingReceiptDirectory = "signing-receipt"
          $signingReceiptFilename = `
            "handy-api-windows-x64-signing-receipt.json"
          New-Item -ItemType Directory -Path $signingReceiptDirectory -Force |
            Out-Null
          $signingReceiptPath = Join-Path $signingReceiptDirectory `
            $signingReceiptFilename
          $signingReceipt = [ordered]@{
            schema_version = 1
            repository = $env:GITHUB_REPOSITORY
            github_run_id = [string]$env:GITHUB_RUN_ID
            candidate_sha = $env:CANDIDATE_SHA
            fork_version = $env:FORK_VERSION
            installer_filename = $expectedName
            signed_artifact_name = $expectedSignedArtifactName
            signed_artifact_id = $env:SIGNED_ARTIFACT_ID
            signed_artifact_archive_sha256 = `
              $env:SIGNED_ARTIFACT_ARCHIVE_SHA256
            unsigned_receipt_artifact_name = `
              "handy-api-windows-x64-unsigned-receipt-$($env:FORK_VERSION)"
            unsigned_receipt_artifact_id = `
              $env:HANDY_API_UNSIGNED_RECEIPT_ARTIFACT_ID
            unsigned_receipt_artifact_archive_sha256 = `
              $env:HANDY_API_UNSIGNED_RECEIPT_ARTIFACT_ARCHIVE_SHA256
            unsigned_receipt_filename = `
              "handy-api-windows-x64-unsigned-receipt.json"
            unsigned_receipt_sha256 = $unsignedReceiptHash
            pre_sign_installer_sha256 = $installerHash
            post_sign_installer_sha256 = $installerHash
            installer_size_bytes = $installerSize
            signature_filename = $expectedSignatureName
            signature_sha256 = $signatureHash
            byte_invariance = $true
            cryptographic_signature_verified = $true
          }
          $signingReceipt | ConvertTo-Json -Depth 3 | Set-Content `
            -LiteralPath $signingReceiptPath -Encoding utf8NoBOM

          $signingReceiptFiles = @(
            Get-ChildItem $signingReceiptDirectory -Recurse -File
          )
          if ($signingReceiptFiles.Count -ne 1 -or
              $signingReceiptFiles[0].Name -cne $signingReceiptFilename -or
              $signingReceiptFiles[0].Length -le 0 -or
              $signingReceiptFiles[0].Length -gt 16384) {
            throw "Signing receipt artifact must contain only the bounded receipt"
          }
          $receiptText = Get-Content -LiteralPath $signingReceiptPath -Raw
          $receiptDocument = $null
          try {
            $receiptDocument = [Text.Json.JsonDocument]::Parse($receiptText)
            if ($receiptDocument.RootElement.ValueKind -cne
                [Text.Json.JsonValueKind]::Object) {
              throw "Signing receipt root must be one JSON object"
            }
            $rawFields = @()
            $rawKinds = @{}
            foreach ($property in $receiptDocument.RootElement.EnumerateObject()) {
              $rawFields += $property.Name
              $rawKinds[$property.Name] = $property.Value.ValueKind
            }
            $signingReceiptReadback = $receiptText | ConvertFrom-Json
          } catch {
            throw "Signing receipt is not valid JSON"
          } finally {
            if ($null -ne $receiptDocument) {
              $receiptDocument.Dispose()
            }
          }
          $expectedFields = @(
            "schema_version",
            "repository",
            "github_run_id",
            "candidate_sha",
            "fork_version",
            "installer_filename",
            "signed_artifact_name",
            "signed_artifact_id",
            "signed_artifact_archive_sha256",
            "unsigned_receipt_artifact_name",
            "unsigned_receipt_artifact_id",
            "unsigned_receipt_artifact_archive_sha256",
            "unsigned_receipt_filename",
            "unsigned_receipt_sha256",
            "pre_sign_installer_sha256",
            "post_sign_installer_sha256",
            "installer_size_bytes",
            "signature_filename",
            "signature_sha256",
            "byte_invariance",
            "cryptographic_signature_verified"
          ) | Sort-Object -CaseSensitive
          $actualFields = @($rawFields) | Sort-Object -CaseSensitive
          if ($actualFields.Count -ne $expectedFields.Count -or
              [string]::Join("`n", $actualFields) -cne
                [string]::Join("`n", $expectedFields)) {
            throw "Signing receipt schema has missing, extra, or mis-cased fields"
          }
          foreach ($stringField in @(
            "repository", "github_run_id", "candidate_sha", "fork_version",
            "installer_filename", "signed_artifact_name", "signed_artifact_id",
            "signed_artifact_archive_sha256", "unsigned_receipt_artifact_name",
            "unsigned_receipt_artifact_id",
            "unsigned_receipt_artifact_archive_sha256",
            "unsigned_receipt_filename", "unsigned_receipt_sha256",
            "pre_sign_installer_sha256", "post_sign_installer_sha256",
            "signature_filename", "signature_sha256"
          )) {
            if ($rawKinds[$stringField] -cne [Text.Json.JsonValueKind]::String) {
              throw "Signing receipt field $stringField must be a JSON string"
            }
          }
          if ($rawKinds["schema_version"] -cne
                [Text.Json.JsonValueKind]::Number -or
              $rawKinds["installer_size_bytes"] -cne
                [Text.Json.JsonValueKind]::Number -or
              $rawKinds["byte_invariance"] -cne
                [Text.Json.JsonValueKind]::True -or
              $rawKinds["cryptographic_signature_verified"] -cne
                [Text.Json.JsonValueKind]::True) {
            throw "Signing receipt typed fields are invalid"
          }
          if ($signingReceiptReadback.schema_version.GetType().FullName -notin
                @("System.Int32", "System.Int64") -or
              [int64]$signingReceiptReadback.schema_version -ne 1 -or
              $signingReceiptReadback.repository -cne $env:GITHUB_REPOSITORY -or
              $signingReceiptReadback.github_run_id -cne
                [string]$env:GITHUB_RUN_ID -or
              $signingReceiptReadback.candidate_sha -cne $env:CANDIDATE_SHA -or
              $signingReceiptReadback.fork_version -cne $env:FORK_VERSION -or
              $signingReceiptReadback.installer_filename -cne $expectedName -or
              $signingReceiptReadback.signed_artifact_name -cne
                $expectedSignedArtifactName -or
              $signingReceiptReadback.signed_artifact_id -cne
                $env:SIGNED_ARTIFACT_ID -or
              $signingReceiptReadback.signed_artifact_archive_sha256 -cne
                $env:SIGNED_ARTIFACT_ARCHIVE_SHA256 -or
              $signingReceiptReadback.unsigned_receipt_artifact_id -cne
                $env:HANDY_API_UNSIGNED_RECEIPT_ARTIFACT_ID -or
              $signingReceiptReadback.unsigned_receipt_artifact_archive_sha256 -cne
                $env:HANDY_API_UNSIGNED_RECEIPT_ARTIFACT_ARCHIVE_SHA256 -or
              $signingReceiptReadback.unsigned_receipt_sha256 -cne
                $unsignedReceiptHash -or
              $signingReceiptReadback.pre_sign_installer_sha256 -cne
                $installerHash -or
              $signingReceiptReadback.post_sign_installer_sha256 -cne
                $installerHash -or
              [int64]$signingReceiptReadback.installer_size_bytes -ne
                $installerSize -or
              $signingReceiptReadback.signature_filename -cne
                $expectedSignatureName -or
              $signingReceiptReadback.signature_sha256 -cne $signatureHash -or
              $signingReceiptReadback.byte_invariance -cne $true -or
              $signingReceiptReadback.cryptographic_signature_verified -cne
                $true) {
            throw "Signing receipt read-back does not match verified evidence"
          }
          Get-FileHash -LiteralPath $installer, $signaturePath, `
            $signingReceiptPath -Algorithm SHA256 | Format-List

      - name: Upload durable signing receipt
        id: upload-signing-receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: handy-api-windows-x64-signing-receipt-${{ needs.prepare-candidate.outputs.fork-version }}
          path: signing-receipt/handy-api-windows-x64-signing-receipt.json
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs:
      - prepare-candidate
      - candidate-gates
      - release-contract
      - build-unsigned-windows-x64
      - sign-windows-updater
    if: needs.prepare-candidate.outputs.update-required == 'true'
    runs-on: ubuntu-24.04
    # This is the second required-reviewer boundary. The signing environment
    # approved only key use; the exact signed artifact is manually accepted on
    # Windows while this job waits. No draft, tag, main update, or public release
    # exists until the Director separately approves production publication.
    environment:
      name: handy-api-production
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout tested candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare-candidate.outputs.candidate-sha }}
          fetch-depth: 0

      - name: Download verified release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.sign-windows-updater.outputs.signed-artifact-id }}
          path: release-assets
          merge-multiple: true

      - name: Download unsigned release receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.build-unsigned-windows-x64.outputs.unsigned-receipt-artifact-id }}
          path: unsigned-receipt
          merge-multiple: true

      - name: Download signing release receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.sign-windows-updater.outputs.signing-receipt-artifact-id }}
          path: signing-receipt
          merge-multiple: true

      - name: Build and verify updater manifest
        env:
          CANDIDATE_SHA: ${{ needs.prepare-candidate.outputs.candidate-sha }}
          FORK_VERSION: ${{ needs.prepare-candidate.outputs.fork-version }}
          RELEASE_TAG: ${{ needs.prepare-candidate.outputs.release-tag }}
          UNSIGNED_ARTIFACT_ID: ${{ needs.build-unsigned-windows-x64.outputs.unsigned-artifact-id }}
          UNSIGNED_ARTIFACT_ARCHIVE_SHA256: ${{ needs.build-unsigned-windows-x64.outputs.unsigned-artifact-digest }}
          UNSIGNED_RECEIPT_ARTIFACT_ID: ${{ needs.build-unsigned-windows-x64.outputs.unsigned-receipt-artifact-id }}
          UNSIGNED_RECEIPT_ARTIFACT_ARCHIVE_SHA256: ${{ needs.build-unsigned-windows-x64.outputs.unsigned-receipt-artifact-digest }}
          SIGNED_ARTIFACT_ID: ${{ needs.sign-windows-updater.outputs.signed-artifact-id }}
          SIGNED_ARTIFACT_ARCHIVE_SHA256: ${{ needs.sign-windows-updater.outputs.signed-artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          expected_name="Handy.API_${FORK_VERSION}_x64-setup.exe"
          installer="release-assets/${expected_name}"
          foreign_installers=(release-assets/*-setup.exe)
          if [[ ${#foreign_installers[@]} -ne 1 ]]; then
            echo "Expected one NSIS setup artifact, found ${#foreign_installers[@]}" >&2
            exit 1
          fi
          if [[ "$(basename "${foreign_installers[0]}")" != "$expected_name" || \
                ! -f "$installer" ]]; then
            echo "Expected only exact NSIS installer $expected_name" >&2
            exit 1
          fi
          signature_file="${installer}.sig"
          if [[ ! -s "$signature_file" ]]; then
            echo "Missing updater signature for $installer" >&2
            exit 1
          fi
          signing_inputs=(release-assets/*)
          if [[ ${#signing_inputs[@]} -ne 2 ]]; then
            echo "Signed release input must contain exactly installer and signature" >&2
            exit 1
          fi

          unsigned_receipt="unsigned-receipt/handy-api-windows-x64-unsigned-receipt.json"
          signing_receipt="signing-receipt/handy-api-windows-x64-signing-receipt.json"
          [[ -f "$unsigned_receipt" && -f "$signing_receipt" ]]
          [[ "$(find unsigned-receipt -type f | wc -l)" -eq 1 ]]
          [[ "$(find signing-receipt -type f | wc -l)" -eq 1 ]]
          unsigned_receipt_sha="$(sha256sum "$unsigned_receipt" | awk '{print $1}')"
          installer_sha="$(sha256sum "$installer" | awk '{print $1}')"
          installer_size="$(stat --format='%s' "$installer")"
          signature_sha="$(sha256sum "$signature_file" | awk '{print $1}')"
          unsigned_artifact_name="handy-api-windows-x64-unsigned-${FORK_VERSION}"
          unsigned_receipt_artifact_name="handy-api-windows-x64-unsigned-receipt-${FORK_VERSION}"
          signed_artifact_name="handy-api-windows-x64-signed-${FORK_VERSION}"
          [[ "$UNSIGNED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$UNSIGNED_ARTIFACT_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$UNSIGNED_RECEIPT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$UNSIGNED_RECEIPT_ARTIFACT_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SIGNED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SIGNED_ARTIFACT_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]

          jq -e --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg candidate_sha "$CANDIDATE_SHA" \
            --arg version "$FORK_VERSION" \
            --arg artifact "$unsigned_artifact_name" \
            --arg artifact_id "$UNSIGNED_ARTIFACT_ID" \
            --arg artifact_digest "$UNSIGNED_ARTIFACT_ARCHIVE_SHA256" \
            --arg filename "$expected_name" \
            --arg sha "$installer_sha" \
            --argjson size "$installer_size" '
              (keys == [
                "candidate_sha", "fork_version", "github_run_id",
                "installer_filename", "installer_sha256",
                "installer_size_bytes", "repository", "schema_version",
                "unsigned_artifact_archive_sha256", "unsigned_artifact_id",
                "unsigned_artifact_name"
              ]) and
              .schema_version == 1 and .repository == $repository and
              .github_run_id == $run_id and .candidate_sha == $candidate_sha and
              .fork_version == $version and
              .unsigned_artifact_name == $artifact and
              .unsigned_artifact_id == $artifact_id and
              .unsigned_artifact_archive_sha256 == $artifact_digest and
              .installer_filename == $filename and
              .installer_size_bytes == $size and .installer_sha256 == $sha
            ' "$unsigned_receipt" >/dev/null

          jq -e --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg candidate_sha "$CANDIDATE_SHA" \
            --arg version "$FORK_VERSION" \
            --arg filename "$expected_name" \
            --arg signed_artifact "$signed_artifact_name" \
            --arg signed_artifact_id "$SIGNED_ARTIFACT_ID" \
            --arg signed_artifact_digest "$SIGNED_ARTIFACT_ARCHIVE_SHA256" \
            --arg receipt_artifact "$unsigned_receipt_artifact_name" \
            --arg receipt_artifact_id "$UNSIGNED_RECEIPT_ARTIFACT_ID" \
            --arg receipt_artifact_digest "$UNSIGNED_RECEIPT_ARTIFACT_ARCHIVE_SHA256" \
            --arg receipt_sha "$unsigned_receipt_sha" \
            --arg installer_sha "$installer_sha" \
            --arg signature_filename "${expected_name}.sig" \
            --arg signature_sha "$signature_sha" \
            --argjson size "$installer_size" '
              (keys == [
                "byte_invariance", "candidate_sha",
                "cryptographic_signature_verified", "fork_version",
                "github_run_id", "installer_filename",
                "installer_size_bytes", "post_sign_installer_sha256",
                "pre_sign_installer_sha256", "repository", "schema_version",
                "signed_artifact_archive_sha256", "signed_artifact_id",
                "signed_artifact_name",
                "signature_filename", "signature_sha256",
                "unsigned_receipt_artifact_archive_sha256",
                "unsigned_receipt_artifact_id",
                "unsigned_receipt_artifact_name",
                "unsigned_receipt_filename", "unsigned_receipt_sha256"
              ]) and
              .schema_version == 1 and .repository == $repository and
              .github_run_id == $run_id and .candidate_sha == $candidate_sha and
              .fork_version == $version and .installer_filename == $filename and
              .signed_artifact_name == $signed_artifact and
              .signed_artifact_id == $signed_artifact_id and
              .signed_artifact_archive_sha256 == $signed_artifact_digest and
              .unsigned_receipt_artifact_name == $receipt_artifact and
              .unsigned_receipt_artifact_id == $receipt_artifact_id and
              .unsigned_receipt_artifact_archive_sha256 ==
                $receipt_artifact_digest and
              .unsigned_receipt_filename ==
                "handy-api-windows-x64-unsigned-receipt.json" and
              .unsigned_receipt_sha256 == $receipt_sha and
              .pre_sign_installer_sha256 == $installer_sha and
              .post_sign_installer_sha256 == $installer_sha and
              .installer_size_bytes == $size and
              .signature_filename == $signature_filename and
              .signature_sha256 == $signature_sha and
              .byte_invariance == true and
              .cryptographic_signature_verified == true
            ' "$signing_receipt" >/dev/null

          signature="$(tr -d '\r\n' <"$signature_file")"
          if [[ -z "$signature" ]]; then
            echo "Updater signature is empty after normalization" >&2
            exit 1
          fi
          encoded_filename="$(node -p 'encodeURIComponent(process.argv[1])' "$expected_name")"
          asset_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${encoded_filename}"
          pub_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          jq -n \
            --arg version "$FORK_VERSION" \
            --arg pub_date "$pub_date" \
            --arg signature "$signature" \
            --arg url "$asset_url" \
            '{
              version: $version,
              notes: "Automated Handy API stable upstream integration.",
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": { signature: $signature, url: $url },
                "windows-x86_64-nsis": { signature: $signature, url: $url }
              }
            }' > release-assets/latest.json

          jq -e \
            --arg version "$FORK_VERSION" \
            --arg url "$asset_url" \
            '.version == $version and
             .platforms["windows-x86_64"].url == $url and
             (.platforms["windows-x86_64"].signature | length > 0)' \
            release-assets/latest.json >/dev/null

      - name: Create non-public draft and upload exact assets
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.prepare-candidate.outputs.candidate-sha }}
          FORK_VERSION: ${{ needs.prepare-candidate.outputs.fork-version }}
          RELEASE_TAG: ${{ needs.prepare-candidate.outputs.release-tag }}
          UPSTREAM_TAG: ${{ needs.prepare-candidate.outputs.upstream-tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it" >&2
            exit 1
          fi
          existing_tag="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}")"
          if [[ -n "$existing_tag" ]]; then
            echo "Git tag $RELEASE_TAG already exists; refusing to retarget it" >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$CANDIDATE_SHA" \
            --title "Handy API ${RELEASE_TAG#v}" \
            --notes "Automated integration of upstream Handy ${UPSTREAM_TAG}." \
            --draft
          gh release upload "$RELEASE_TAG" \
            "release-assets/Handy.API_${FORK_VERSION}_x64-setup.exe" \
            "release-assets/Handy.API_${FORK_VERSION}_x64-setup.exe.sig" \
            release-assets/latest.json \
            --repo "$GITHUB_REPOSITORY"

      - name: Verify draft inventory and uploaded bytes
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_VERSION: ${{ needs.prepare-candidate.outputs.fork-version }}
          RELEASE_TAG: ${{ needs.prepare-candidate.outputs.release-tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          expected_name="Handy.API_${FORK_VERSION}_x64-setup.exe"

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          if ! jq -e \
            --arg tag "$RELEASE_TAG" \
            --arg installer "$expected_name" '
            ([.assets[].name]) as $assets |
            .tag_name == $tag and
            .draft == true and
            .prerelease == false and
            ($assets | sort) ==
              ([$installer, ($installer + ".sig"), "latest.json"] | sort)
          ' <<<"$release_json" >/dev/null; then
            echo "Draft release does not have the exact installer/signature/manifest inventory" >&2
            exit 1
          fi

          uploaded_dir="$RUNNER_TEMP/handy-api-uploaded-assets"
          mkdir -p "$uploaded_dir"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$uploaded_dir"

          local_assets=(release-assets/*)
          uploaded_assets=("$uploaded_dir"/*)
          if [[ ${#local_assets[@]} -ne 3 || ${#uploaded_assets[@]} -ne 3 ]]; then
            echo "Expected exactly three local and uploaded assets" >&2
            exit 1
          fi
          for local_asset in "${local_assets[@]}"; do
            uploaded_asset="$uploaded_dir/$(basename "$local_asset")"
            if [[ ! -f "$uploaded_asset" ]] || ! cmp --silent "$local_asset" "$uploaded_asset"; then
              echo "Uploaded asset differs from verified workflow input: $(basename "$local_asset")" >&2
              exit 1
            fi
          done

          installer="release-assets/${expected_name}"
          encoded_filename="$(node -p 'encodeURIComponent(process.argv[1])' "$expected_name")"
          expected_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${encoded_filename}"
          signature="$(tr -d '\r\n' <"${installer}.sig")"
          jq -e \
            --arg version "$FORK_VERSION" \
            --arg signature "$signature" \
            --arg url "$expected_url" \
            '.version == $version and
             .platforms["windows-x86_64"].url == $url and
             .platforms["windows-x86_64"].signature == $signature and
             .platforms["windows-x86_64-nsis"].url == $url and
             .platforms["windows-x86_64-nsis"].signature == $signature' \
            "$uploaded_dir/latest.json" >/dev/null

      - name: Fast-forward main and publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.prepare-candidate.outputs.candidate-sha }}
          FORK_VERSION: ${{ needs.prepare-candidate.outputs.fork-version }}
          RELEASE_TAG: ${{ needs.prepare-candidate.outputs.release-tag }}
        shell: bash
        run: |
          set -euo pipefail

          # main moves only after the non-public draft's remote bytes have been
          # read back and verified. Making that draft public is the final release
          # mutation, so no partially uploaded release is ever updater-visible.
          git fetch origin main
          git merge-base --is-ancestor origin/main "$CANDIDATE_SHA"
          git push origin "$CANDIDATE_SHA:refs/heads/main"

          # The GITHUB_TOKEN push above does not trigger push workflows. The
          # candidate was already tested by candidate-gates in this same run.
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest

          final_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          expected_name="Handy.API_${FORK_VERSION}_x64-setup.exe"
          jq -e \
            --arg tag "$RELEASE_TAG" \
            --arg installer "$expected_name" '
              ([.assets[].name]) as $assets |
              .tag_name == $tag and
              .draft == false and
              .prerelease == false and
              ($assets | sort) ==
                ([$installer, ($installer + ".sig"), "latest.json"] | sort)
            ' \
            <<<"$final_json" >/dev/null
