name: "Handy API Upstream Sync"

on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: handy-api-upstream-sync
  cancel-in-progress: false

jobs:
  prepare-candidate:
    if: github.repository == 'MakinaX/Handy-Api'
    runs-on: ubuntu-24.04
    outputs:
      update-required: ${{ steps.detect.outputs.update-required }}
      candidate-branch: ${{ steps.candidate.outputs.candidate-branch }}
      candidate-sha: ${{ steps.candidate.outputs.candidate-sha }}
      fork-version: ${{ steps.detect.outputs.fork-version }}
      release-tag: ${{ steps.detect.outputs.release-tag }}
      upstream-tag: ${{ steps.detect.outputs.upstream-tag }}
    steps:
      - name: Require main-owned workflow source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Upstream sync must be dispatched from the fork main branch" >&2
            exit 1
          fi

      - name: Checkout fork main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.23

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0

      - name: Detect latest upstream stable
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          fork_repo_json="$(gh api "repos/${GITHUB_REPOSITORY}")"
          if [[ "$(jq -r '.private' <<<"$fork_repo_json")" != "false" || \
                "$(jq -r '.visibility' <<<"$fork_repo_json")" != "public" ]]; then
            echo "Handy API releases require a public GitHub repository" >&2
            exit 1
          fi
          if [[ "$(jq -r '.default_branch' <<<"$fork_repo_json")" != "main" ]]; then
            echo "Handy API requires main as the default branch" >&2
            exit 1
          fi
          if [[ "$GITHUB_REPOSITORY" != "MakinaX/Handy-Api" ]]; then
            echo "Repository must be MakinaX/Handy-Api, got $GITHUB_REPOSITORY" >&2
            exit 1
          fi

          release_json="$(gh api repos/cjpais/Handy/releases/latest)"
          upstream_tag="$(jq -r '.tag_name' <<<"$release_json")"
          draft="$(jq -r '.draft' <<<"$release_json")"
          prerelease="$(jq -r '.prerelease' <<<"$release_json")"

          if [[ "$draft" != "false" || "$prerelease" != "false" ]]; then
            echo "Latest upstream release is not stable; refusing to continue" >&2
            exit 1
          fi
          if [[ ! "$upstream_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected upstream stable tag: $upstream_tag" >&2
            exit 1
          fi

          upstream_version="${upstream_tag#v}"
          fork_version="${upstream_version}-api.1"
          release_tag="v${fork_version}"
          expected_installer="Handy.API_${fork_version}_x64-setup.exe"

          git remote add upstream https://github.com/cjpais/Handy.git 2>/dev/null || \
            git remote set-url upstream https://github.com/cjpais/Handy.git
          git fetch --force upstream "refs/tags/${upstream_tag}:refs/tags/${upstream_tag}"

          integrated=false
          if git merge-base --is-ancestor "$upstream_tag" HEAD; then
            integrated=true
          fi

          published=false
          existing=false
          if fork_release_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${release_tag}" 2>/dev/null
          )"; then
            existing=true
            if jq -e \
              --arg tag "$release_tag" \
              --arg installer "$expected_installer" '
              ([.assets[].name]) as $assets |
              .tag_name == $tag and
              .draft == false and
              .prerelease == false and
              ($assets | sort) ==
                ([$installer, ($installer + ".sig"), "latest.json"] | sort)
            ' <<<"$fork_release_json" >/dev/null; then
              published=true
            else
              echo "Release $release_tag exists but is draft or has an incomplete/non-exact asset inventory" >&2
              echo "Resolve or delete that non-public release before retrying; it will never be overwritten" >&2
              exit 1
            fi
          fi

          fork_tag_sha="$(
            git ls-remote --tags origin "refs/tags/${release_tag}" |
              awk 'NR == 1 { print $1 }'
          )"
          if [[ "$existing" == "true" && -z "$fork_tag_sha" ]]; then
            echo "Release $release_tag exists without its exact Git tag" >&2
            exit 1
          fi
          if [[ "$existing" != "true" && -n "$fork_tag_sha" ]]; then
            echo "Git tag $release_tag exists without a release; refusing to retarget it" >&2
            exit 1
          fi
          if [[ "$published" == "true" ]]; then
            git fetch --force origin "refs/tags/${release_tag}:refs/tags/${release_tag}"
            if ! git merge-base --is-ancestor "$release_tag" HEAD; then
              echo "Published release tag $release_tag is not contained in fork main" >&2
              exit 1
            fi
          fi

          if [[ "$published" == "true" && "$integrated" != "true" ]]; then
            echo "Complete release $release_tag exists but fork main does not contain $upstream_tag" >&2
            exit 1
          fi

          update_required=true
          if [[ "$integrated" == "true" && "$published" == "true" ]]; then
            update_required=false
          fi

          echo "upstream-tag=$upstream_tag" >> "$GITHUB_OUTPUT"
          echo "fork-version=$fork_version" >> "$GITHUB_OUTPUT"
          echo "release-tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "update-required=$update_required" >> "$GITHUB_OUTPUT"
          echo "Latest upstream stable: $upstream_tag; integrated=$integrated; existing=$existing; published=$published"

      - name: Merge stable and reapply fork identity
        id: candidate
        if: steps.detect.outputs.update-required == 'true'
        env:
          FORK_VERSION: ${{ steps.detect.outputs.fork-version }}
          UPSTREAM_TAG: ${{ steps.detect.outputs.upstream-tag }}
        shell: bash
        run: |
          set -euo pipefail

          candidate_branch="automation/upstream-${UPSTREAM_TAG#v}"
          prior_candidate_sha="$(
            git ls-remote --heads origin "refs/heads/${candidate_branch}" |
              awk 'NR == 1 { print $1 }'
          )"
          preserved_updater="$RUNNER_TEMP/handy-api-tauri-before-merge.json"
          cp src-tauri/tauri.conf.json "$preserved_updater"

          git config user.name "handy-api-updater[bot]"
          git config user.email "handy-api-updater[bot]@users.noreply.github.com"
          git checkout -B "$candidate_branch"

          if ! git merge-base --is-ancestor "$UPSTREAM_TAG" HEAD; then
            set +e
            git merge --no-ff --no-commit "$UPSTREAM_TAG"
            merge_status=$?
            set -e

            if [[ $merge_status -ne 0 ]]; then
              unresolved="$(git diff --name-only --diff-filter=U)"
              if [[ -z "$unresolved" ]]; then
                echo "Upstream merge failed without resolvable file conflicts" >&2
                exit 1
              fi

              unexpected=""
              while IFS= read -r conflicted; do
                case "$conflicted" in
                  package.json|bun.lock|src-tauri/Cargo.toml|src-tauri/Cargo.lock|src-tauri/tauri.conf.json) ;;
                  *) unexpected+="$conflicted"$'\n' ;;
                esac
              done <<<"$unresolved"

              if [[ -n "$unexpected" ]]; then
                echo "Unexpected upstream conflicts; refusing automatic resolution:" >&2
                printf '%s' "$unexpected" >&2
                exit 1
              fi

              bun scripts/check-handy-api-release.ts --resolve-upstream-conflicts
              git add package.json bun.lock src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
              if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
                echo "Known release-metadata conflicts remain unresolved" >&2
                exit 1
              fi
            fi
          fi

          bun scripts/check-handy-api-release.ts \
            --set-version "$FORK_VERSION" \
            --preserve-updater-from "$preserved_updater"

          # Refresh generated root-workspace metadata after the upstream merge.
          # Dependency selection remains constrained by the merged lockfiles.
          bun install --lockfile-only --ignore-scripts
          cargo metadata \
            --manifest-path src-tauri/Cargo.toml \
            --format-version 1 \
            --no-deps >/dev/null

          bun scripts/check-handy-api-release.ts
          git add -A
          git diff --cached --check

          if ! git diff --cached --quiet || git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "chore: integrate Handy ${UPSTREAM_TAG} into Handy API"
          fi

          candidate_sha="$(git rev-parse HEAD)"
          if [[ -n "$prior_candidate_sha" ]]; then
            git push \
              --force-with-lease="refs/heads/${candidate_branch}:${prior_candidate_sha}" \
              origin "HEAD:refs/heads/${candidate_branch}"
          else
            git push origin "HEAD:refs/heads/${candidate_branch}"
          fi
          echo "candidate-branch=$candidate_branch" >> "$GITHUB_OUTPUT"
          echo "candidate-sha=$candidate_sha" >> "$GITHUB_OUTPUT"

  # This is a direct reusable-workflow call, not a workflow triggered by the
  # candidate-branch push. GitHub deliberately does not trigger new workflow
  # runs for pushes made with GITHUB_TOKEN, so all release gates stay in this run.
  candidate-gates:
    needs: prepare-candidate
    if: needs.prepare-candidate.outputs.update-required == 'true'
    uses: ./.github/workflows/handy-api-ci.yml
    with:
      ref: ${{ needs.prepare-candidate.outputs.candidate-sha }}

  release-contract:
    needs:
      - prepare-candidate
      - candidate-gates
    if: needs.prepare-candidate.outputs.update-required == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tested candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare-candidate.outputs.candidate-sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.23

      - name: Reject setup placeholders before release
        run: >-
          bun scripts/check-handy-api-release.ts
          --release
          --repository "$GITHUB_REPOSITORY"

  build-unsigned-windows-x64:
    needs:
      - prepare-candidate
      - candidate-gates
      - release-contract
    if: needs.prepare-candidate.outputs.update-required == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tested candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare-candidate.outputs.candidate-sha }}

      - name: Enable Windows long paths
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.23

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@30ba978f977e81b72d091fc8888feb1fb26f9aff # v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Locate VC++ runtime for app-local bundling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -property installationPath
          if (-not $vsRoot) { throw "vswhere found no Visual Studio installation" }
          $versionFile = Join-Path $vsRoot "VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt"
          $redistVersion = (Get-Content $versionFile).Trim()
          $archDir = Join-Path $vsRoot "VC\Redist\MSVC\$redistVersion\x64"
          $crt = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.CRT" |
            Sort-Object Name | Select-Object -Last 1
          $omp = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.OpenMP" |
            Sort-Object Name | Select-Object -Last 1
          if (-not $crt -or -not (Test-Path (Join-Path $crt.FullName "msvcp140.dll"))) {
            throw "VC++ CRT redistributable is unavailable"
          }
          if (-not $omp -or -not (Test-Path (Join-Path $omp.FullName "vcomp140.dll"))) {
            throw "VC++ OpenMP redistributable is unavailable"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "HANDY_VC_REDIST_DIRS=$($crt.FullName);$($omp.FullName)"

      - name: Install baseline ONNX Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ortVersion = "1.24.2"
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v$ortVersion/onnxruntime-win-x64-$ortVersion.zip"
          Invoke-WebRequest -Uri $url -OutFile ort.zip
          Expand-Archive -Path ort.zip -DestinationPath ort-dist -Force
          $ortLib = (Resolve-Path "ort-dist/onnxruntime-win-x64-$ortVersion/lib").Path
          Add-Content -Path $env:GITHUB_ENV -Value "ORT_LIB_LOCATION=$ortLib"
          Add-Content -Path $env:GITHUB_ENV -Value "ORT_PREFER_DYNAMIC_LINK=1"

      - name: Install SPIR-V headers
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_PREFIX_PATH=$prefix"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build unsigned NSIS updater artifact
        run: >-
          bun run tauri build
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
          --target x86_64-pc-windows-msvc
          --bundles nsis
          -- --locked

      - name: Verify exact unsigned updater output and runtime
        env:
          FORK_VERSION: ${{ needs.prepare-candidate.outputs.fork-version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          if (-not (Test-Path $bundle)) {
            throw "Target-specific NSIS bundle directory is missing: $bundle"
          }
          # Tauri names the raw NSIS file from productName and therefore keeps
          # the space in "Handy API". Require that exact single build output,
          # then canonicalize only its filename for the stable release URL.
          $generatedName = "Handy API_$($env:FORK_VERSION)_x64-setup.exe"
          $expectedName = "Handy.API_$($env:FORK_VERSION)_x64-setup.exe"
          $expectedPath = Join-Path $bundle $expectedName
          $generatedInstallers = @(Get-ChildItem $bundle -File -Filter "*-setup.exe")
          if ($generatedInstallers.Count -ne 1 -or
              $generatedInstallers[0].Name -cne $generatedName) {
            throw "Tauri must emit exactly one expected raw NSIS installer: $generatedName"
          }
          $generatedInstaller = $generatedInstallers[0]
          if (($generatedInstaller.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
            throw "Raw NSIS installer must not be a reparse point"
          }
          if (Get-ChildItem $bundle -File -Filter "*.sig") {
            throw "Unsigned build unexpectedly emitted an updater signature"
          }
          if (Test-Path $expectedPath) {
            throw "Canonical NSIS destination already exists: $expectedName"
          }
          $generatedHash = (Get-FileHash -LiteralPath $generatedInstaller.FullName `
            -Algorithm SHA256).Hash
          Move-Item -LiteralPath $generatedInstaller.FullName -Destination $expectedPath

          $canonicalInstallers = @(Get-ChildItem $bundle -File -Filter "*-setup.exe")
          if ($canonicalInstallers.Count -ne 1 -or
              $canonicalInstallers[0].Name -cne $expectedName -or
              -not (Test-Path $expectedPath -PathType Leaf)) {
            throw "Canonicalization must leave only the exact NSIS installer: $expectedName"
          }
          $installer = Get-Item -LiteralPath $expectedPath
          $canonicalHash = (Get-FileHash -LiteralPath $installer.FullName `
            -Algorithm SHA256).Hash
          if ($canonicalHash -cne $generatedHash) {
            throw "Canonical NSIS rename changed installer bytes"
          }

          # Exercise the shipped package, not the unbundled build output. This
          # is the x64 NSIS portable-mode smoke used by upstream, adjusted for
          # the fork's executable identity and target-specific output path.
          $stagedDlls = @(Get-ChildItem "src-tauri/transcribe-libs" -File -Filter "*.dll")
          if ($stagedDlls.Count -eq 0) {
            throw "src-tauri/transcribe-libs contains no staged runtime DLLs"
          }
          $installRoot = Join-Path $env:RUNNER_TEMP "handy-api-installed-$([Guid]::NewGuid())"
          New-Item -ItemType Directory -Path $installRoot | Out-Null
          try {
            $install = Start-Process -FilePath $installer.FullName `
              -ArgumentList @("/S", "/PORTABLE", "/D=$installRoot") `
              -Wait -PassThru
            if ($install.ExitCode -ne 0) {
              throw "Silent NSIS portable install failed with exit code $($install.ExitCode)"
            }

            $executables = @(Get-ChildItem $installRoot -Recurse -File -Filter "handy-api.exe")
            if ($executables.Count -ne 1) {
              throw "Installed package must contain exactly one handy-api.exe; found $($executables.Count)"
            }
            $appExe = $executables[0].FullName
            if (Get-ChildItem $installRoot -Recurse -File -Filter "handy.exe") {
              throw "Installed package still contains the official handy.exe identity"
            }
            $retiredGeminiExecutable = "handy-" + "gemini.exe"
            if (Get-ChildItem $installRoot -Recurse -File -Filter $retiredGeminiExecutable) {
              throw "Installed package still contains the retired Gemini-product executable identity"
            }
            foreach ($dll in $stagedDlls) {
              if (-not (Get-ChildItem $installRoot -Recurse -File -Filter $dll.Name)) {
                throw "Installed package is missing staged runtime DLL $($dll.Name)"
              }
            }

            $deviceOutput = (& $appExe --list-devices 2>&1 | Out-String)
            $deviceOutput | Write-Host
            if ($LASTEXITCODE -ne 0) {
              throw "Installed handy-api.exe --list-devices failed"
            }
          } finally {
            if (Test-Path $installRoot) {
              Remove-Item -Recurse -Force $installRoot
            }
          }

          $postSmokeHash = (Get-FileHash -LiteralPath $installer.FullName `
            -Algorithm SHA256).Hash
          if ($postSmokeHash -cne $generatedHash) {
            throw "Runtime smoke changed installer bytes"
          }
          New-Item -ItemType Directory -Path unsigned-assets -Force | Out-Null
          $stagedPath = Join-Path "unsigned-assets" $expectedName
          Copy-Item -LiteralPath $installer.FullName -Destination $stagedPath
          $stagedHash = (Get-FileHash -LiteralPath $stagedPath -Algorithm SHA256).Hash
          if ($stagedHash -cne $generatedHash) {
            throw "Staged unsigned installer bytes do not match the verified build"
          }
          Get-FileHash -LiteralPath $stagedPath -Algorithm SHA256 | Format-List

      - name: Upload exact unsigned signing input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: handy-api-windows-x64-unsigned-${{ needs.prepare-candidate.outputs.fork-version }}
          path: unsigned-assets/Handy.API_${{ needs.prepare-candidate.outputs.fork-version }}_x64-setup.exe
          if-no-files-found: error
          retention-days: 14

  sign-windows-updater:
    needs:
      - prepare-candidate
      - candidate-gates
      - release-contract
      - build-unsigned-windows-x64
    if: needs.prepare-candidate.outputs.update-required == 'true'
    runs-on: windows-latest
    # This is the first point at which updater signing secrets are available.
    # The required reviewer approves the tested unsigned candidate before this
    # job starts. This job never checks out or executes candidate source: it
    # signs only the exact installer artifact built by the preceding job.
    environment:
      name: handy-api-signing
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download exact unsigned signing input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: handy-api-windows-x64-unsigned-${{ needs.prepare-candidate.outputs.fork-version }}
          path: signing-input

      - name: Verify input and read committed updater public key as data
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ needs.prepare-candidate.outputs.candidate-sha }}
          FORK_VERSION: ${{ needs.prepare-candidate.outputs.fork-version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -cne "MakinaX/Handy-Api") {
            throw "Signing is restricted to MakinaX/Handy-Api"
          }
          if ($env:CANDIDATE_SHA -notmatch '^[0-9a-f]{40}$') {
            throw "Candidate SHA is not an exact commit ID"
          }

          $expectedName = "Handy.API_$($env:FORK_VERSION)_x64-setup.exe"
          $inputFiles = @(Get-ChildItem signing-input -Recurse -File)
          if ($inputFiles.Count -ne 1 -or $inputFiles[0].Name -cne $expectedName) {
            throw "Signing input must contain only $expectedName"
          }

          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $configUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/contents/src-tauri/tauri.conf.json?ref=$env:CANDIDATE_SHA"
          $response = Invoke-RestMethod -Uri $configUri -Headers $headers
          $configBytes = [Convert]::FromBase64String(($response.content -replace '\s', ''))
          $config = [Text.Encoding]::UTF8.GetString($configBytes) | ConvertFrom-Json
          $expectedEndpoint = "https://github.com/MakinaX/Handy-Api/releases/latest/download/latest.json"
          if ($config.productName -cne "Handy API" -or
              $config.mainBinaryName -cne "handy-api" -or
              $config.version -cne $env:FORK_VERSION -or
              $config.identifier -cne "computer.handy.api" -or
              $config.plugins.updater.endpoints.Count -ne 1 -or
              $config.plugins.updater.endpoints[0] -cne $expectedEndpoint) {
            throw "Candidate updater identity does not match the exact signing contract"
          }
          if ([string]::IsNullOrWhiteSpace($config.plugins.updater.pubkey) -or
              $config.plugins.updater.pubkey -ceq "REPLACE_WITH_TAURI_UPDATER_PUBLIC_KEY") {
            throw "Committed updater public key is missing or still a placeholder"
          }
          Set-Content -Path (Join-Path $env:RUNNER_TEMP "handy-api-updater-public-key.base64") `
            -Value $config.plugins.updater.pubkey -NoNewline

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.88.0

      - name: Install trusted Tauri signer without secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signerRoot = Join-Path $env:RUNNER_TEMP "trusted-tauri-cli"
          cargo install tauri-cli --version 2.11.4 --locked --root $signerRoot
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned Tauri CLI installation failed"
          }
          $signerExe = Join-Path $signerRoot "bin/cargo-tauri.exe"
          if (-not (Test-Path $signerExe -PathType Leaf)) {
            throw "Pinned Tauri signer executable is missing"
          }
          $signerVersion = (& $signerExe --version | Out-String).Trim()
          if ($signerVersion -cne "tauri-cli 2.11.4") {
            throw "Unexpected Tauri signer version: $signerVersion"
          }
          Add-Content -Path $env:GITHUB_ENV -Value "TAURI_SIGNER_EXE=$signerExe"

      - name: Sign exact updater artifact
        shell: pwsh
        env:
          FORK_VERSION: ${{ needs.prepare-candidate.outputs.fork-version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is not configured in handy-api-signing"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not configured in handy-api-signing"
          }
          $installer = Join-Path signing-input "Handy.API_$($env:FORK_VERSION)_x64-setup.exe"
          & $env:TAURI_SIGNER_EXE signer sign $installer
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned Tauri updater signing failed"
          }

      - name: Verify exact signature with committed public key
        shell: pwsh
        env:
          FORK_VERSION: ${{ needs.prepare-candidate.outputs.fork-version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedName = "Handy.API_$($env:FORK_VERSION)_x64-setup.exe"
          $installer = Join-Path signing-input $expectedName
          $signaturePath = "${installer}.sig"
          $signedFiles = @(Get-ChildItem signing-input -Recurse -File)
          if ($signedFiles.Count -ne 2 -or
              -not (Test-Path $installer -PathType Leaf) -or
              -not (Test-Path $signaturePath -PathType Leaf) -or
              (Get-Item $signaturePath).Length -eq 0) {
            throw "Signed artifact must contain only the exact installer and its non-empty .sig"
          }
          $foreignInstallers = @(
            Get-ChildItem signing-input -Recurse -File -Filter "*-setup.exe" |
              Where-Object Name -CNE $expectedName
          )
          if ($foreignInstallers.Count -ne 0) {
            throw "Foreign signed installer found: $($foreignInstallers.Name -join ', ')"
          }

          $verifierUrl = "https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip"
          $verifierArchive = Join-Path $env:RUNNER_TEMP "minisign-0.12-win64.zip"
          $verifierRoot = Join-Path $env:RUNNER_TEMP "minisign-0.12-win64"
          Invoke-WebRequest -Uri $verifierUrl -OutFile $verifierArchive
          $verifierHash = (Get-FileHash $verifierArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($verifierHash -ne "37b600344e20c19314b2e82813db2bfdcc408b77b876f7727889dbd46d539479") {
            throw "Pinned Minisign verifier archive digest mismatch"
          }
          Expand-Archive -Path $verifierArchive -DestinationPath $verifierRoot -Force
          $verifiers = @(Get-ChildItem $verifierRoot -Recurse -File -Filter "minisign.exe")
          if ($verifiers.Count -ne 1) {
            throw "Expected exactly one minisign.exe, found $($verifiers.Count)"
          }

          $publicKeyBase64 = Get-Content `
            (Join-Path $env:RUNNER_TEMP "handy-api-updater-public-key.base64") -Raw
          $publicKeyPath = Join-Path $env:RUNNER_TEMP "handy-api-updater.pub"
          $decodedSignaturePath = Join-Path $env:RUNNER_TEMP "handy-api-installer.minisig"
          try {
            [IO.File]::WriteAllBytes(
              $publicKeyPath,
              [Convert]::FromBase64String($publicKeyBase64.Trim())
            )
            [IO.File]::WriteAllBytes(
              $decodedSignaturePath,
              [Convert]::FromBase64String((Get-Content $signaturePath -Raw).Trim())
            )
          } catch {
            throw "Updater public key or signature is not valid base64"
          }

          $verifierExe = $verifiers[0].FullName
          & $verifierExe -Vm $installer -p $publicKeyPath -x $decodedSignaturePath
          if ($LASTEXITCODE -ne 0) {
            throw "Cryptographic updater signature verification failed"
          }

          New-Item -ItemType Directory -Path signed-assets -Force | Out-Null
          Copy-Item $installer signed-assets/
          Copy-Item $signaturePath signed-assets/
          Get-FileHash $installer, $signaturePath -Algorithm SHA256 | Format-List

      - name: Upload exact signed acceptance artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: handy-api-windows-x64-signed-${{ needs.prepare-candidate.outputs.fork-version }}
          path: |
            signed-assets/Handy.API_${{ needs.prepare-candidate.outputs.fork-version }}_x64-setup.exe
            signed-assets/Handy.API_${{ needs.prepare-candidate.outputs.fork-version }}_x64-setup.exe.sig
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs:
      - prepare-candidate
      - candidate-gates
      - release-contract
      - sign-windows-updater
    if: needs.prepare-candidate.outputs.update-required == 'true'
    runs-on: ubuntu-24.04
    # This is the second required-reviewer boundary. The signing environment
    # approved only key use; the exact signed artifact is manually accepted on
    # Windows while this job waits. No draft, tag, main update, or public release
    # exists until the Director separately approves production publication.
    environment:
      name: handy-api-production
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout tested candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.prepare-candidate.outputs.candidate-sha }}
          fetch-depth: 0

      - name: Download verified release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: handy-api-windows-x64-signed-${{ needs.prepare-candidate.outputs.fork-version }}
          path: release-assets

      - name: Build and verify updater manifest
        env:
          FORK_VERSION: ${{ needs.prepare-candidate.outputs.fork-version }}
          RELEASE_TAG: ${{ needs.prepare-candidate.outputs.release-tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          expected_name="Handy.API_${FORK_VERSION}_x64-setup.exe"
          installer="release-assets/${expected_name}"
          foreign_installers=(release-assets/*-setup.exe)
          if [[ ${#foreign_installers[@]} -ne 1 ]]; then
            echo "Expected one NSIS setup artifact, found ${#foreign_installers[@]}" >&2
            exit 1
          fi
          if [[ "$(basename "${foreign_installers[0]}")" != "$expected_name" || \
                ! -f "$installer" ]]; then
            echo "Expected only exact NSIS installer $expected_name" >&2
            exit 1
          fi
          signature_file="${installer}.sig"
          if [[ ! -s "$signature_file" ]]; then
            echo "Missing updater signature for $installer" >&2
            exit 1
          fi
          signing_inputs=(release-assets/*)
          if [[ ${#signing_inputs[@]} -ne 2 ]]; then
            echo "Signed release input must contain exactly installer and signature" >&2
            exit 1
          fi

          signature="$(tr -d '\r\n' <"$signature_file")"
          if [[ -z "$signature" ]]; then
            echo "Updater signature is empty after normalization" >&2
            exit 1
          fi
          encoded_filename="$(node -p 'encodeURIComponent(process.argv[1])' "$expected_name")"
          asset_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${encoded_filename}"
          pub_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          jq -n \
            --arg version "$FORK_VERSION" \
            --arg pub_date "$pub_date" \
            --arg signature "$signature" \
            --arg url "$asset_url" \
            '{
              version: $version,
              notes: "Automated Handy API stable upstream integration.",
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": { signature: $signature, url: $url },
                "windows-x86_64-nsis": { signature: $signature, url: $url }
              }
            }' > release-assets/latest.json

          jq -e \
            --arg version "$FORK_VERSION" \
            --arg url "$asset_url" \
            '.version == $version and
             .platforms["windows-x86_64"].url == $url and
             (.platforms["windows-x86_64"].signature | length > 0)' \
            release-assets/latest.json >/dev/null

      - name: Create non-public draft and upload exact assets
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.prepare-candidate.outputs.candidate-sha }}
          FORK_VERSION: ${{ needs.prepare-candidate.outputs.fork-version }}
          RELEASE_TAG: ${{ needs.prepare-candidate.outputs.release-tag }}
          UPSTREAM_TAG: ${{ needs.prepare-candidate.outputs.upstream-tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it" >&2
            exit 1
          fi
          existing_tag="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}")"
          if [[ -n "$existing_tag" ]]; then
            echo "Git tag $RELEASE_TAG already exists; refusing to retarget it" >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$CANDIDATE_SHA" \
            --title "Handy API ${RELEASE_TAG#v}" \
            --notes "Automated integration of upstream Handy ${UPSTREAM_TAG}." \
            --draft
          gh release upload "$RELEASE_TAG" \
            "release-assets/Handy.API_${FORK_VERSION}_x64-setup.exe" \
            "release-assets/Handy.API_${FORK_VERSION}_x64-setup.exe.sig" \
            release-assets/latest.json \
            --repo "$GITHUB_REPOSITORY"

      - name: Verify draft inventory and uploaded bytes
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_VERSION: ${{ needs.prepare-candidate.outputs.fork-version }}
          RELEASE_TAG: ${{ needs.prepare-candidate.outputs.release-tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          expected_name="Handy.API_${FORK_VERSION}_x64-setup.exe"

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          if ! jq -e \
            --arg tag "$RELEASE_TAG" \
            --arg installer "$expected_name" '
            ([.assets[].name]) as $assets |
            .tag_name == $tag and
            .draft == true and
            .prerelease == false and
            ($assets | sort) ==
              ([$installer, ($installer + ".sig"), "latest.json"] | sort)
          ' <<<"$release_json" >/dev/null; then
            echo "Draft release does not have the exact installer/signature/manifest inventory" >&2
            exit 1
          fi

          uploaded_dir="$RUNNER_TEMP/handy-api-uploaded-assets"
          mkdir -p "$uploaded_dir"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$uploaded_dir"

          local_assets=(release-assets/*)
          uploaded_assets=("$uploaded_dir"/*)
          if [[ ${#local_assets[@]} -ne 3 || ${#uploaded_assets[@]} -ne 3 ]]; then
            echo "Expected exactly three local and uploaded assets" >&2
            exit 1
          fi
          for local_asset in "${local_assets[@]}"; do
            uploaded_asset="$uploaded_dir/$(basename "$local_asset")"
            if [[ ! -f "$uploaded_asset" ]] || ! cmp --silent "$local_asset" "$uploaded_asset"; then
              echo "Uploaded asset differs from verified workflow input: $(basename "$local_asset")" >&2
              exit 1
            fi
          done

          installer="release-assets/${expected_name}"
          encoded_filename="$(node -p 'encodeURIComponent(process.argv[1])' "$expected_name")"
          expected_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${encoded_filename}"
          signature="$(tr -d '\r\n' <"${installer}.sig")"
          jq -e \
            --arg version "$FORK_VERSION" \
            --arg signature "$signature" \
            --arg url "$expected_url" \
            '.version == $version and
             .platforms["windows-x86_64"].url == $url and
             .platforms["windows-x86_64"].signature == $signature and
             .platforms["windows-x86_64-nsis"].url == $url and
             .platforms["windows-x86_64-nsis"].signature == $signature' \
            "$uploaded_dir/latest.json" >/dev/null

      - name: Fast-forward main and publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.prepare-candidate.outputs.candidate-sha }}
          FORK_VERSION: ${{ needs.prepare-candidate.outputs.fork-version }}
          RELEASE_TAG: ${{ needs.prepare-candidate.outputs.release-tag }}
        shell: bash
        run: |
          set -euo pipefail

          # main moves only after the non-public draft's remote bytes have been
          # read back and verified. Making that draft public is the final release
          # mutation, so no partially uploaded release is ever updater-visible.
          git fetch origin main
          git merge-base --is-ancestor origin/main "$CANDIDATE_SHA"
          git push origin "$CANDIDATE_SHA:refs/heads/main"

          # The GITHUB_TOKEN push above does not trigger push workflows. The
          # candidate was already tested by candidate-gates in this same run.
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest

          final_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          expected_name="Handy.API_${FORK_VERSION}_x64-setup.exe"
          jq -e \
            --arg tag "$RELEASE_TAG" \
            --arg installer "$expected_name" '
              ([.assets[].name]) as $assets |
              .tag_name == $tag and
              .draft == false and
              .prerelease == false and
              ($assets | sort) ==
                ([$installer, ($installer + ".sig"), "latest.json"] | sort)
            ' \
            <<<"$final_json" >/dev/null
